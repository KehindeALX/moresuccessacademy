<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>More Success Academy — Ecosystem Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{
    --navy:#050B2E; --navy-deep:#03071A; --gold:#D4AF37; --gold-light:#E6C666;
    --teal:#2E8368; --cream:#F1EFEA; --ink-soft:#A9AEC4;
    --panel:rgba(255,255,255,0.05); --line:rgba(255,255,255,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#e5e5e5;font-family:'DM Sans',sans-serif;}
  .stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 12px;}
  .phone{
    width:100%;max-width:380px;height:760px;background:var(--navy);
    border-radius:2.25rem;border:8px solid var(--navy-deep);
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
    display:flex;flex-direction:column;overflow:hidden;position:relative;
  }
  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 4px;color:var(--cream);font-size:12px;font-weight:600;}
  .statusbar i{font-size:12px;margin-left:6px;}
  .topheader{display:flex;align-items:center;gap:10px;padding:8px 20px 16px;border-bottom:1px solid var(--line);min-height:20px;}
  .topheader h1{font-family:'Syne',sans-serif;font-weight:700;font-size:17px;color:var(--cream);margin:0;}
  .topheader button{background:none;border:none;color:var(--cream);font-size:20px;cursor:pointer;padding:2px;}
  .screen{flex:1;overflow-y:auto;padding:0 20px 24px;}
  .navbar{display:flex;border-top:1px solid var(--line);background:var(--navy-deep);}
  .navbtn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;cursor:pointer;color:var(--ink-soft);font-family:'DM Sans',sans-serif;}
  .navbtn i{font-size:17px;}
  .navbtn span{font-size:9.5px;font-weight:500;}
  .navbtn.active{color:var(--gold);}
  .navbtn.active span{font-weight:700;}
  .homebar{display:flex;justify-content:center;padding:6px 0 8px;background:var(--navy-deep);}
  .homebar div{width:110px;height:4px;border-radius:4px;background:rgba(255,255,255,0.25);}

  h2.title{font-family:'Syne',sans-serif;font-weight:700;color:var(--cream);font-size:19px;margin:4px 0 4px;}
  p.sub{color:var(--ink-soft);font-size:12.5px;margin:0 0 18px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
  .badge{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:12px;}
  .badge-gold{background:rgba(212,175,55,0.14);color:var(--gold-light);border:1px solid rgba(212,175,55,0.4);}
  .badge-teal{background:rgba(46,131,104,0.18);color:#8fe0c4;border:1px solid rgba(46,131,104,0.5);}
  .badge-grey{background:rgba(255,255,255,0.06);color:var(--ink-soft);border:1px solid var(--line);}
  .btn-gold{background:var(--gold);color:var(--navy-deep);border:none;font-weight:700;font-family:'DM Sans',sans-serif;padding:13px 20px;border-radius:8px;width:100%;cursor:pointer;font-size:14px;}
  .btn-ghost{background:transparent;color:var(--cream);border:1.5px solid var(--line);font-weight:600;font-family:'DM Sans',sans-serif;padding:12px 20px;border-radius:8px;cursor:pointer;font-size:14px;}
  input[type=text],input[type=email],textarea{
    width:100%;padding:11px 13px;border-radius:8px;border:1.5px solid var(--line);
    background:var(--panel);color:var(--cream);font-family:'DM Sans',sans-serif;font-size:14px;margin-bottom:14px;
  }
  label.field-label{display:block;color:var(--ink-soft);font-size:12px;margin-bottom:6px;font-family:'DM Sans',sans-serif;}
  .chip-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .chip{padding:11px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);color:var(--cream);font-size:13px;cursor:pointer;text-align:left;font-family:'DM Sans',sans-serif;}
  .chip.picked{background:var(--gold);color:var(--navy-deep);border-color:var(--gold);font-weight:700;}
  .progressbar{display:flex;gap:6px;margin:4px 0 22px;}
  .progressbar div{height:4px;flex:1;border-radius:4px;background:var(--line);}
  .progressbar div.filled{background:var(--gold);}
  .phase-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .phase-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;cursor:pointer;color:var(--cream);font-family:'DM Sans',sans-serif;}
  .phase-card i{color:var(--gold-light);font-size:17px;display:block;margin-bottom:8px;}
  .phase-card span{font-size:12px;font-weight:600;line-height:1.3;display:block;}
  .roadmap-row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;}
  .roadmap-row i{width:17px;}
  .roadmap-row span{font-size:13px;color:var(--cream);font-family:'DM Sans',sans-serif;}
  .roadmap-row.done span{color:var(--ink-soft);text-decoration:line-through;}
  .studentrow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;margin-bottom:12px;}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--gold);color:var(--navy-deep);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;font-family:'DM Sans',sans-serif;}
  .studentrow .name{color:var(--cream);font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;}
  .studentrow .meta{color:var(--ink-soft);font-size:11.5px;font-family:'DM Sans',sans-serif;}
  .doc-row,.scho-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:10px;}
  .doc-row{display:flex;align-items:center;gap:12px;}
  .doc-row .info p{margin:0;font-family:'DM Sans',sans-serif;}
  .doc-row .type{color:var(--cream);font-size:13px;font-weight:500;}
  .doc-row .who{color:var(--ink-soft);font-size:11px;}
  .upload-box{border:1.5px dashed var(--line);background:var(--panel);border-radius:12px;padding:24px;text-align:center;margin-bottom:18px;}
  .upload-box i{color:var(--gold-light);font-size:20px;margin-bottom:8px;}
  .upload-box p{margin:2px 0;font-family:'DM Sans',sans-serif;}
  .upload-box .t1{color:var(--cream);font-size:13px;font-weight:600;}
  .upload-box .t2{color:var(--ink-soft);font-size:11px;}
  .scho-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
  .scho-name{color:var(--cream);font-size:13.5px;font-weight:600;font-family:'DM Sans',sans-serif;padding-right:8px;}
  .scho-meta{color:var(--ink-soft);font-size:11.5px;font-family:'DM Sans',sans-serif;display:flex;gap:12px;flex-wrap:wrap;}
  .chatwrap{display:flex;flex-direction:column;height:100%;}
  .chatlog{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:10px;}
  .msg{max-width:85%;padding:10px 12px;border-radius:12px;font-size:13px;font-family:'DM Sans',sans-serif;line-height:1.5;}
  .msg.bot{background:var(--panel);border:1px solid var(--line);color:var(--cream);align-self:flex-start;}
  .msg.user{background:var(--gold);color:var(--navy-deep);align-self:flex-end;}
  .suggestions{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .suggestions button{font-size:11px;padding:6px 10px;border-radius:14px;background:rgba(212,175,55,0.1);border:1px solid rgba(212,175,55,0.35);color:var(--gold-light);cursor:pointer;font-family:'DM Sans',sans-serif;}
  .chatinput{display:flex;gap:8px;}
  .chatinput input{flex:1;margin:0;}
  .chatinput button{background:var(--gold);border:none;border-radius:8px;width:42px;color:var(--navy-deep);cursor:pointer;font-size:15px;}
  .navrow{display:flex;gap:12px;margin-top:20px;}
  .navrow button{flex:1;}
</style>
</head>
<body>

<div class="stage">
  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <span><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
    </div>
    <div class="topheader" id="topheader"></div>
    <div class="screen" id="screen"></div>
    <div class="navbar" id="navbar"></div>
    <div class="homebar"><div></div></div>
  </div>
</div>

<script>
(function(){

  var LOGO_SRC = 'https://moresuccessacademy.com.ng/assets/images/logo.jpg';

  // TODO: replace with the real Formspree endpoint for the demo's own form
  // (separate from apply.html's xzdlobpq) — create it at formspree.io first.
  var DEMO_SUBMIT_ENDPOINT = 'https://formspree.io/f/meeyyyrg';

  var roadmapSteps = ['Intake Form','Profile Review','School Shortlist','Scholarship Shortlist','CV','Statement of Purpose','Applications','Admissions','Funding','Visa','Pre-departure','Arrival Support'];

  var students = [
    { id:'deborah', name:'Deborah Obot', initials:'DO', program:'Occupational Health, Safety & Wellness', school:'Conestoga College', country:'Canada', progressStep:9, task:'Pay $2,500 deposit', due:'23 Jul 2026', status:'In Progress', budget:'$20,835.50 CAD (Yr 1)', funding:'Loan (under review)' },
    { id:'caleb', name:'Caleb Ofonime', initials:'CO', program:'Computer Science — Graduate Study', school:'Shortlisting in progress', country:'Canada / UK / USA', progressStep:3, task:'Finalize school shortlist', due:'This week', status:'In Progress', budget:'To be confirmed', funding:'Self + Family' },
    { id:'amara', name:'Amara Nwachukwu', initials:'AN', program:'Public Health — MPH', school:'University of Leeds (offer received)', country:'United Kingdom', progressStep:8, task:'Submit CAS visa documents', due:'02 Aug 2026', status:'In Progress', budget:'£19,500 (Yr 1)', funding:'Family + Partial Scholarship' },
    { id:'tunde', name:'Tunde Bakare', initials:'TB', program:'Mechanical Engineering — BEng', school:'Researching options', country:'Germany', progressStep:2, task:'Complete German language placement test', due:'15 Aug 2026', status:'In Progress', budget:'€850/mo living cost (tuition-free)', funding:'Self-funded' },
    { id:'chiamaka', name:'Chiamaka Eze', initials:'CE', program:'Data Science — MSc', school:'Admitted to Dublin City University', country:'Ireland', progressStep:11, task:'Book pre-departure orientation', due:'10 Aug 2026', status:'Nearly there', budget:'€16,200 (Yr 1)', funding:'Scholarship (60%) + Family' },
    { id:'ifeoma', name:'Ifeoma Chukwu', initials:'IC', program:'Nursing — BSN Bridging Program', school:'Not yet shortlisted', country:'Undecided (Canada or Ireland)', progressStep:1, task:'Complete intake profile review', due:'This week', status:'Just started', budget:'Not yet estimated', funding:'Not yet determined' }
  ];

  var scholarships = [
    { name:'Conestoga Entrance Award', student:'Deborah', amount:'Varies', deadline:'TBD', status:'Awarded' },
    { name:'Ontario Graduate Scholarship', student:'Deborah', amount:'CAD $15,000', deadline:'Sep 2026', status:'Not Started' },
    { name:'Merit-Based Award', student:'Caleb', amount:'Varies', deadline:'TBD', status:'Not Started' },
    { name:'Graduate Assistantship', student:'Caleb', amount:'Tuition + Stipend', deadline:'Rolling', status:'Researching' },
    { name:'Leeds Partial International Award', student:'Amara', amount:'£4,000', deadline:'Awarded', status:'Awarded' },
    { name:'DAAD Study Scholarship', student:'Tunde', amount:'€850/month', deadline:'Oct 2026', status:'Researching' },
    { name:'Erasmus Mundus Joint Master', student:'Chiamaka', amount:'€9,700', deadline:'Awarded', status:'Awarded' },
    { name:'DCU International Merit Award', student:'Chiamaka', amount:'€2,000', deadline:'Awarded', status:'Awarded' },
    { name:'Nursing Bridging Bursary', student:'Ifeoma', amount:'Varies', deadline:'TBD', status:'Not Started' }
  ];

  var documents = [
    { type:'Academic Transcript', student:'Caleb', status:'Uploaded' },
    { type:'CV / Resume', student:'Caleb', status:'Missing' },
    { type:'Admission Letter', student:'Deborah', status:'Uploaded' },
    { type:'Passport Bio Page', student:'Deborah', status:'Missing' },
    { type:'Statement of Purpose', student:'Caleb', status:'Missing' },
    { type:'Degree Certificate', student:'Caleb', status:'Uploaded' },
    { type:'CAS Statement', student:'Amara', status:'Uploaded' },
    { type:'TB Test Result', student:'Amara', status:'Uploaded' },
    { type:'Language Test Certificate', student:'Tunde', status:'Missing' },
    { type:'Blocked Account Proof', student:'Tunde', status:'Missing' },
    { type:'Offer Letter', student:'Chiamaka', status:'Uploaded' },
    { type:'Financial Statement', student:'Chiamaka', status:'Uploaded' },
    { type:'Nursing License Verification', student:'Ifeoma', status:'Missing' }
  ];

  var advisorAnswers = {
    'Which Canadian schools fit my GPA?': "With a Second Class Lower CGPA, Ontario college graduate certificates (like Conestoga) are strong, realistic fits — they weigh recent coursework and career direction heavily. For university master's programs, look for ones stating holistic review rather than a strict CGPA cutoff.",
    'What scholarships match my profile?': "I'd start with institutional entrance awards (often automatic on admission) and graduate assistantships, which don't need a separate application in many cases. Application-required ones with deadlines are flagged on your Scholarships tab.",
    'Help me improve my SOP opening line': "Open with the specific moment that pointed you toward this field, not a general statement about passion. A concrete story is more memorable than \"I have always been passionate about...\""
  };

  var state = {
    screen: 'home',
    applyStep: 0,
    applyData: { name:'', email:'', country:'', goal:'' },
    applyDone: false,
    applySubmitStatus: 'idle', // idle | sending | sent | error
    dashboardSelected: 'deborah',
    mentorSelected: null,
    mentorSearch: '',
    mentorStatusFilter: 'All',
    chat: [{ from:'bot', text:"Hi! I'm the MSA AI Admission Advisor demo. Try one of the questions below." }]
  };

  function esc(s){ var d=document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

  function progressRingSVG(step){
    var pct = Math.round((step/roadmapSteps.length)*100);
    var r=20, c=2*Math.PI*r, off = c*(1-pct/100);
    return '<div style="display:flex;align-items:center;gap:12px;">' +
      '<div style="position:relative;width:48px;height:48px;">' +
      '<svg width="48" height="48" style="transform:rotate(-90deg)">' +
      '<circle cx="24" cy="24" r="'+r+'" stroke="var(--line)" stroke-width="4" fill="none"/>' +
      '<circle cx="24" cy="24" r="'+r+'" stroke="var(--gold)" stroke-width="4" fill="none" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" stroke-linecap="round"/>' +
      '</svg>' +
      '<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--cream);font-size:11px;font-weight:700;font-family:\'DM Sans\',sans-serif;">'+pct+'%</span>' +
      '</div>' +
      '<div><p style="margin:0;color:var(--cream);font-size:13px;font-weight:600;font-family:\'DM Sans\',sans-serif;">Step '+step+' of '+roadmapSteps.length+'</p>' +
      '<p style="margin:0;color:var(--ink-soft);font-size:11.5px;font-family:\'DM Sans\',sans-serif;">'+esc(roadmapSteps[step-1])+'</p></div></div>';
  }

  // ===== Screens =====
  var screens = {

    home: function(){
      var phases = [
        ['fa-file-alt','Mentorship Landing','apply'],
        ['fa-file-circle-check','Application Form','apply'],
        ['fa-chart-line','Student Dashboard','dashboard'],
        ['fa-users','Mentor Dashboard','mentor'],
        ['fa-upload','Document Uploads','docs'],
        ['fa-award','Scholarship Mgmt','scholarships'],
        ['fa-robot','AI Advisor','advisor']
      ];
      var html = '<div style="text-align:center;padding-top:8px;">' +
        '<img src="'+LOGO_SRC+'" alt="MSA" style="width:64px;height:64px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px rgba(212,175,55,0.5);margin-bottom:14px;">' +
        '<p style="color:var(--gold);font-size:11px;letter-spacing:2px;text-transform:uppercase;font-family:\'DM Sans\',sans-serif;margin-bottom:8px;">Global Admissions &amp; Scholarship Mentorship</p>' +
        '<h1 style="font-family:\'Syne\',sans-serif;font-weight:700;color:var(--cream);font-size:23px;line-height:1.25;margin:0 0 10px;">Start your international journey with confidence.</h1>' +
        '<p style="color:var(--ink-soft);font-size:13px;margin:0 0 22px;">We Train. We Certify. We Place. We Migrate.</p>' +
        '</div>' +
        '<button class="btn-gold" style="margin-bottom:26px;" onclick="MSA.goTo(\'apply\')"><i class="fas fa-arrow-right" style="margin-right:8px;"></i>Apply for Mentorship</button>' +
        '<p style="color:var(--ink-soft);font-size:11px;letter-spacing:1px;text-transform:uppercase;font-family:\'DM Sans\',sans-serif;margin-bottom:10px;">Ecosystem preview — 7 phases</p>' +
        '<div class="phase-grid">';
      phases.forEach(function(p){
        html += '<button class="phase-card" onclick="MSA.goTo(\''+p[2]+'\')"><i class="fas '+p[0]+'"></i><span>'+p[1]+'</span></button>';
      });
      html += '</div>';
      return html;
    },

    apply: function(){
      if(state.applyDone){
        return '<div style="text-align:center;padding-top:60px;">' +
          '<div style="width:56px;height:56px;border-radius:50%;background:rgba(46,131,104,0.18);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">' +
          '<i class="fas fa-check" style="color:#8fe0c4;font-size:22px;"></i></div>' +
          '<h2 style="font-family:\'Syne\',sans-serif;color:var(--cream);font-size:19px;margin-bottom:8px;">Application received</h2>' +
          '<p style="color:var(--ink-soft);font-size:13px;line-height:1.6;max-width:240px;margin:0 auto 30px;">'+esc(state.applyData.name||'Your')+' mentor will review this and reach out within 48 hours.</p>' +
          '<button class="btn-gold" style="width:auto;padding:12px 28px;" onclick="MSA.resetApply()">Back to Home</button></div>';
      }
      if(state.applySubmitStatus === 'sending'){
        return '<div style="text-align:center;padding-top:80px;">' +
          '<i class="fas fa-circle-notch fa-spin" style="color:var(--gold-light);font-size:26px;margin-bottom:16px;"></i>' +
          '<p style="color:var(--ink-soft);font-size:13px;">Submitting your application...</p></div>';
      }
      if(state.applySubmitStatus === 'error'){
        return '<div style="text-align:center;padding-top:60px;">' +
          '<div style="width:56px;height:56px;border-radius:50%;background:rgba(110,44,44,0.25);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">' +
          '<i class="fas fa-triangle-exclamation" style="color:#e88;font-size:20px;"></i></div>' +
          '<h2 style="font-family:\'Syne\',sans-serif;color:var(--cream);font-size:19px;margin-bottom:8px;">Submission failed</h2>' +
          '<p style="color:var(--ink-soft);font-size:13px;line-height:1.6;max-width:240px;margin:0 auto 24px;">Something went wrong sending your application. Nothing was lost — try again.</p>' +
          '<button class="btn-gold" style="width:auto;padding:12px 28px;" onclick="MSA.submitDemoApplication()">Try Again</button></div>';
      }
      var total = 3, step = state.applyStep;
      var bars = '';
      for(var i=0;i<total;i++){ bars += '<div class="'+(i<=step?'filled':'')+'"></div>'; }
      var body = '';
      if(step===0){
        body = '<p style="color:var(--gold);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-family:\'DM Sans\',sans-serif;margin-bottom:8px;">Step 1 of 3</p>' +
          '<h2 class="title">Tell us about you</h2>' +
          '<label class="field-label">Full name</label>' +
          '<input type="text" id="apName" value="'+esc(state.applyData.name)+'" placeholder="e.g. Deborah Obot">' +
          '<label class="field-label">Email address</label>' +
          '<input type="email" id="apEmail" value="'+esc(state.applyData.email)+'" placeholder="you@example.com">';
      } else if(step===1){
        var countries = ['Canada','United Kingdom','United States','Ireland','Germany','Other'];
        body = '<p style="color:var(--gold);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-family:\'DM Sans\',sans-serif;margin-bottom:8px;">Step 2 of 3</p>' +
          '<h2 class="title">Where to?</h2><div class="chip-grid">';
        countries.forEach(function(c){
          body += '<div class="chip'+(state.applyData.country===c?' picked':'')+'" onclick="MSA.pickCountry(\''+c+'\')">'+c+'</div>';
        });
        body += '</div>';
      } else {
        body = '<p style="color:var(--gold);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-family:\'DM Sans\',sans-serif;margin-bottom:8px;">Step 3 of 3</p>' +
          '<h2 class="title">Your career goal</h2>' +
          '<textarea id="apGoal" rows="5" placeholder="What do you want to study, and why?">'+esc(state.applyData.goal)+'</textarea>';
      }
      var nav = '<div class="navrow">';
      if(step>0) nav += '<button class="btn-ghost" onclick="MSA.applyBack()">Back</button>';
      nav += '<button class="btn-gold" onclick="MSA.applyNext()">'+(step<total-1?'Continue':'Submit')+'</button></div>';
      return '<div class="progressbar">'+bars+'</div>' + body + nav;
    },

    dashboard: function(){
      var s = students.filter(function(x){return x.id===state.dashboardSelected;})[0] || students[0];
      var html = '<label class="field-label" style="margin-top:4px;">Previewing as</label>' +
        '<select onchange="MSA.pickDashboardStudent(this.value)" style="width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);color:var(--cream);font-family:\'DM Sans\',sans-serif;font-size:13px;margin-bottom:14px;">';
      students.forEach(function(st){
        html += '<option value="'+st.id+'"'+(st.id===s.id?' selected':'')+'>'+esc(st.name)+' — '+esc(st.country)+'</option>';
      });
      html += '</select>' +
        '<h2 class="title" style="margin-top:0;">'+s.name.split(' ')[0]+"'s Roadmap</h2>" +
        '<div class="card">'+progressRingSVG(s.progressStep)+'</div>' +
        '<div class="card" style="background:rgba(212,175,55,0.08);border-color:rgba(212,175,55,0.3);">' +
        '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;"><i class="fas fa-clock" style="color:var(--gold-light);font-size:12px;"></i>' +
        '<span style="color:var(--gold-light);font-size:11px;font-weight:700;text-transform:uppercase;font-family:\'DM Sans\',sans-serif;">Next Deadline</span></div>' +
        '<p style="color:var(--cream);font-size:14px;font-weight:600;margin:0;font-family:\'DM Sans\',sans-serif;">'+esc(s.task)+'</p>' +
        '<p style="color:var(--ink-soft);font-size:12.5px;margin:2px 0 0;font-family:\'DM Sans\',sans-serif;">Due '+esc(s.due)+'</p></div>' +
        '<div class="card"><div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;"><i class="fas fa-location-dot" style="color:var(--gold-light);font-size:12px;"></i>' +
        '<span style="color:var(--cream);font-size:13px;font-weight:600;font-family:\'DM Sans\',sans-serif;">'+esc(s.school)+'</span></div>' +
        '<p style="color:var(--ink-soft);font-size:12px;margin:0;font-family:\'DM Sans\',sans-serif;">'+esc(s.program)+' · '+esc(s.country)+'</p></div>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;">' +
        '<p style="color:var(--ink-soft);font-size:11px;letter-spacing:1px;text-transform:uppercase;font-family:\'DM Sans\',sans-serif;margin:0;">Roadmap · tap the highlighted step</p></div>';
      roadmapSteps.forEach(function(step, i){
        var num = i+1, done = num < s.progressStep, active = num === s.progressStep;
        var clickable = active && s.progressStep < roadmapSteps.length;
        html += '<div class="roadmap-row'+(done?' done':'')+'" style="'+(active?'background:rgba(212,175,55,0.08);cursor:pointer;':'')+'"'+
          (clickable ? ' onclick="MSA.advanceStep(\''+s.id+'\')"' : '') + '>' +
          '<i class="fas '+(done?'fa-circle-check':'fa-circle')+'" style="color:'+(done?'var(--teal)':(active?'var(--gold)':'var(--ink-soft)'))+';font-size:14px;"></i>' +
          '<span>'+esc(step)+'</span>' +
          (clickable ? '<span style="margin-left:auto;color:var(--gold-light);font-size:10.5px;font-family:\'DM Sans\',sans-serif;">Mark done</span>' : '') +
          '</div>';
      });
      if(s.progressStep >= roadmapSteps.length){
        html += '<div class="card" style="text-align:center;background:rgba(46,131,104,0.12);border-color:rgba(46,131,104,0.4);margin-top:12px;">' +
          '<i class="fas fa-champagne-glasses" style="color:#8fe0c4;font-size:18px;margin-bottom:6px;"></i>' +
          '<p style="color:var(--cream);font-size:13px;margin:0;font-family:\'DM Sans\',sans-serif;">All roadmap steps complete — arrival supported!</p></div>';
      }
      return html;
    },

    mentor: function(){
      if(state.mentorSelected){
        var s = students.filter(function(x){return x.id===state.mentorSelected;})[0];
        var rows = [
          ['fa-graduation-cap','Program', s.program+' — '+s.school],
          ['fa-location-dot','Destination', s.country],
          ['fa-sack-dollar','Budget & Funding', s.budget+' · '+s.funding],
          ['fa-clock','Next Deadline', s.task+' — '+s.due]
        ];
        var html = '<button onclick="MSA.mentorBack()" style="background:none;border:none;color:var(--gold-light);font-size:13px;margin-bottom:14px;cursor:pointer;font-family:\'DM Sans\',sans-serif;"><i class="fas fa-chevron-left" style="margin-right:4px;"></i>All students</button>' +
          '<div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;">' +
          '<div class="avatar" style="width:44px;height:44px;">'+s.initials+'</div>' +
          '<div><h2 style="font-family:\'Syne\',sans-serif;color:var(--cream);font-size:17px;margin:0 0 4px;">'+esc(s.name)+'</h2><span class="badge badge-gold">'+esc(s.status)+'</span></div></div>';
        rows.forEach(function(r){
          html += '<div class="card" style="display:flex;gap:10px;align-items:flex-start;">' +
            '<i class="fas '+r[0]+'" style="color:var(--gold-light);margin-top:2px;width:16px;"></i>' +
            '<div><p style="color:var(--ink-soft);font-size:10.5px;text-transform:uppercase;margin:0 0 2px;font-family:\'DM Sans\',sans-serif;">'+r[1]+'</p>' +
            '<p style="color:var(--cream);font-size:13px;margin:0;font-family:\'DM Sans\',sans-serif;">'+esc(r[2])+'</p></div></div>';
        });
        html += '<div class="card"><p style="color:var(--ink-soft);font-size:10.5px;text-transform:uppercase;margin:0 0 10px;font-family:\'DM Sans\',sans-serif;">Roadmap progress</p>'+progressRingSVG(s.progressStep)+'</div>';
        return html;
      }
      var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">' +
        '<h2 class="title" style="margin:0;">Your Students</h2><span class="badge badge-grey">'+students.length+' active</span></div>' +
        '<p class="sub">Tap a student for their full profile</p>' +
        '<input type="text" placeholder="Search by name or country..." value="'+esc(state.mentorSearch)+'" ' +
        'oninput="MSA.setMentorSearch(this.value)" style="margin-bottom:10px;">' +
        '<div class="chip-grid" style="margin-bottom:16px;">';
      ['All','Just started','In Progress','Nearly there'].forEach(function(f){
        html += '<div class="chip'+(state.mentorStatusFilter===f?' picked':'')+'" onclick="MSA.setMentorStatusFilter(\''+f+'\')">'+f+'</div>';
      });
      html += '</div>';
      var q = state.mentorSearch.toLowerCase();
      var filtered = students.filter(function(s){
        var matchesSearch = !q || s.name.toLowerCase().indexOf(q)>-1 || s.country.toLowerCase().indexOf(q)>-1;
        var matchesStatus = state.mentorStatusFilter==='All' || s.status===state.mentorStatusFilter;
        return matchesSearch && matchesStatus;
      });
      if(!filtered.length){
        html += '<p style="color:var(--ink-soft);font-size:13px;text-align:center;padding:20px 0;font-family:\'DM Sans\',sans-serif;">No students match this search.</p>';
      }
      filtered.forEach(function(s){
        html += '<div class="studentrow" onclick="MSA.selectStudent(\''+s.id+'\')">' +
          '<div class="avatar">'+s.initials+'</div>' +
          '<div style="flex:1;min-width:0;"><p class="name" style="margin:0;">'+esc(s.name)+'</p>' +
          '<p class="meta" style="margin:0;">'+esc(s.country)+' · '+esc(s.task)+'</p></div>' +
          '<i class="fas fa-chevron-right" style="color:var(--ink-soft);"></i></div>';
      });
      return html;
    },

    docs: function(){
      var html = '<h2 class="title">Documents</h2><p class="sub">Across all '+students.length+' students</p>' +
        '<div class="upload-box"><i class="fas fa-upload"></i><p class="t1">Tap to upload a document</p><p class="t2">Demo only — no file is actually stored</p></div>';
      documents.forEach(function(d){
        html += '<div class="doc-row"><i class="fas fa-file-lines" style="color:var(--ink-soft);"></i>' +
          '<div class="info" style="flex:1;"><p class="type">'+esc(d.type)+'</p><p class="who">'+esc(d.student)+'</p></div>' +
          '<span class="badge '+(d.status==='Uploaded'?'badge-teal':'badge-grey')+'">'+d.status+'</span></div>';
      });
      return html;
    },

    scholarships: function(){
      var html = '<h2 class="title">Scholarships</h2><p class="sub">Shortlist across all '+students.length+' students</p>';
      scholarships.forEach(function(s){
        html += '<div class="scho-card"><div class="scho-top"><span class="scho-name">'+esc(s.name)+'</span>' +
          '<span class="badge '+(s.status==='Awarded'?'badge-teal':(s.status==='Researching'?'badge-gold':'badge-grey'))+'">'+s.status+'</span></div>' +
          '<div class="scho-meta"><span>'+esc(s.student)+'</span><span><i class="fas fa-dollar-sign"></i> '+esc(s.amount)+'</span><span><i class="fas fa-calendar"></i> '+esc(s.deadline)+'</span></div></div>';
      });
      return html;
    },

    advisor: function(){
      var html = '<div class="chatwrap"><div style="display:flex;align-items:center;gap:8px;margin:4px 0 14px;">' +
        '<i class="fas fa-wand-magic-sparkles" style="color:var(--gold-light);"></i>' +
        '<h2 style="font-family:\'Syne\',sans-serif;color:var(--cream);font-size:17px;margin:0;">AI Admission Advisor</h2></div>' +
        '<div class="chatlog" id="chatlog">';
      state.chat.forEach(function(m){
        html += '<div class="msg '+m.from+'">'+esc(m.text)+'</div>';
      });
      html += '</div><div class="suggestions">';
      Object.keys(advisorAnswers).forEach(function(q){
        html += '<button onclick="MSA.sendChat('+"'"+q.replace(/'/g,"\\'")+"'"+')">'+esc(q)+'</button>';
      });
      html += '</div><div class="chatinput"><input type="text" id="chatInput" placeholder="Ask a question..." onkeydown="if(event.key===\'Enter\')MSA.sendChatFromInput();">' +
        '<button onclick="MSA.sendChatFromInput()"><i class="fas fa-paper-plane"></i></button></div></div>';
      return html;
    },

    more: function(){
      var items = [
        ['fa-users','Mentor Dashboard','Phase 4 — student list & profiles','mentor'],
        ['fa-upload','Document Uploads','Phase 5 — transcripts, CVs, passports','docs'],
        ['fa-award','Scholarship Management','Phase 6 — shortlist & deadlines','scholarships']
      ];
      var html = '<h2 class="title">More</h2>';
      items.forEach(function(it){
        html += '<div class="studentrow" onclick="MSA.goTo(\''+it[3]+'\')" style="align-items:center;">' +
          '<i class="fas '+it[0]+'" style="color:var(--gold-light);font-size:18px;width:20px;"></i>' +
          '<div style="flex:1;"><p class="name" style="margin:0;">'+it[1]+'</p><p class="meta" style="margin:0;">'+it[2]+'</p></div>' +
          '<i class="fas fa-chevron-right" style="color:var(--ink-soft);"></i></div>';
      });
      return html;
    }
  };

  var titles = { apply:'Mentorship Application', dashboard:'My Roadmap', mentor:'Mentor Dashboard', docs:'Documents', scholarships:'Scholarships' };
  var navItems = [
    ['home','fa-house','Home'], ['apply','fa-file-circle-check','Apply'], ['dashboard','fa-chart-line','Dashboard'],
    ['advisor','fa-robot','Advisor'], ['more','fa-bars','More']
  ];

  function render(){
    document.getElementById('screen').innerHTML = screens[state.screen]();
    var subScreens = ['mentor','docs','scholarships'];
    var activeTab = subScreens.indexOf(state.screen) > -1 ? 'more' : state.screen;

    var th = document.getElementById('topheader');
    if(titles[state.screen]){
      var showBack = subScreens.indexOf(state.screen) > -1;
      th.innerHTML = (showBack ? '<button onclick="MSA.goTo(\'more\')"><i class="fas fa-chevron-left"></i></button>' : '') +
        '<h1>'+titles[state.screen]+'</h1>';
    } else {
      th.innerHTML = '';
    }

    var nav = document.getElementById('navbar');
    nav.innerHTML = '';
    navItems.forEach(function(item){
      var btn = document.createElement('button');
      btn.className = 'navbtn' + (activeTab===item[0] ? ' active' : '');
      btn.innerHTML = '<i class="fas '+item[1]+'"></i><span>'+item[2]+'</span>';
      btn.onclick = function(){ MSA.goTo(item[0]); };
      nav.appendChild(btn);
    });

    if(state.screen==='advisor'){
      var log = document.getElementById('chatlog');
      if(log) log.scrollTop = log.scrollHeight;
    }
  }

  window.MSA = {
    goTo: function(s){ state.screen = s; render(); },
    resetApply: function(){ state.applyStep=0; state.applyDone=false; state.applySubmitStatus='idle'; state.applyData={name:'',email:'',country:'',goal:''}; state.screen='home'; render(); },
    pickCountry: function(c){ state.applyData.country = c; render(); },
    applyBack: function(){
      if(state.applyStep===1){
        state.applyData.name = document.getElementById('apName') ? document.getElementById('apName').value : state.applyData.name;
        state.applyData.email = document.getElementById('apEmail') ? document.getElementById('apEmail').value : state.applyData.email;
      }
      state.applyStep -= 1; render();
    },
    applyNext: function(){
      if(state.applyStep===0){
        state.applyData.name = document.getElementById('apName').value;
        state.applyData.email = document.getElementById('apEmail').value;
        state.applyStep = 1;
        render();
      } else if(state.applyStep===1){
        state.applyStep = 2;
        render();
      } else {
        state.applyData.goal = document.getElementById('apGoal').value;
        this.submitDemoApplication();
      }
    },
    submitDemoApplication: function(){
      if(DEMO_SUBMIT_ENDPOINT.indexOf('REPLACE_WITH_DEMO_FORM_ID') > -1){
        alert('Demo submission endpoint is not wired up yet: paste your real Formspree form ID into DEMO_SUBMIT_ENDPOINT near the top of the script before going live.');
        return;
      }
      state.applySubmitStatus = 'sending';
      render();
      fetch(DEMO_SUBMIT_ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type':'application/json','Accept':'application/json'},
        body: JSON.stringify({
          name: state.applyData.name,
          email: state.applyData.email,
          country: state.applyData.country,
          goal: state.applyData.goal,
          _subject: 'New MSA Demo Mentorship Interest — ' + (state.applyData.name || 'Unnamed applicant')
        })
      }).then(function(res){
        if(res.ok){
          state.applySubmitStatus = 'sent';
          state.applyDone = true;
        } else {
          state.applySubmitStatus = 'error';
        }
        render();
      }).catch(function(){
        state.applySubmitStatus = 'error';
        render();
      });
    },
    pickDashboardStudent: function(id){ state.dashboardSelected = id; render(); },
    advanceStep: function(id){
      var s = students.filter(function(x){return x.id===id;})[0];
      if(s && s.progressStep < roadmapSteps.length){
        s.progressStep += 1;
        s.task = s.progressStep >= roadmapSteps.length ? 'All steps complete' : 'Continue with ' + roadmapSteps[s.progressStep - 1];
      }
      render();
    },
    setMentorSearch: function(v){ state.mentorSearch = v; render(); var i=document.querySelector('.screen input[type=text]'); if(i){ i.focus(); i.value=v; i.setSelectionRange(v.length,v.length); } },
    setMentorStatusFilter: function(f){ state.mentorStatusFilter = f; render(); },
    selectStudent: function(id){ state.mentorSelected = id; render(); },
    mentorBack: function(){ state.mentorSelected = null; render(); },
    sendChatFromInput: function(){
      var input = document.getElementById('chatInput');
      var val = input.value;
      if(!val.trim()) return;
      this.sendChat(val);
    },
    sendChat: function(text){
      state.chat.push({ from:'user', text:text });
      render();
      var log = document.getElementById('chatlog');
      if(log) log.scrollTop = log.scrollHeight;
      setTimeout(function(){
        var answer = advisorAnswers[text] || "That's a great question for your human mentor to dig into with you directly — this demo only has canned answers for the three suggestions shown.";
        state.chat.push({ from:'bot', text:answer });
        render();
      }, 500);
    }
  };

  render();
})();
</script>
</body>
</html>
