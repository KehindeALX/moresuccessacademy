<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>More Success Academy — Global Admissions & Scholarship Mentorship Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#14213D;
    --navy-deep:#0D1730;
    --cream:#FBF7EF;
    --paper:#FFFDF8;
    --gold:#B8862B;
    --gold-light:#D9B65E;
    --burgundy:#6E2C2C;
    --teal:#1F4B43;
    --ink:#22252B;
    --ink-soft:#5B5F6B;
    --line:#DCD4C2;
    --display: 'Fraunces', serif;
    --mono: 'Space Mono', monospace;
    --body: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--body);
    background:var(--navy);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  /* ===== Cover bar ===== */
  .coverbar{
    background:linear-gradient(180deg,var(--navy) 0%, var(--navy-deep) 100%);
    color:var(--cream);
    padding:22px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:3px solid var(--gold);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .crest{
    width:44px;height:44px;border-radius:50%;
    border:2px solid var(--gold-light);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display);
    font-weight:700;
    font-size:16px;
    color:var(--gold-light);
    flex-shrink:0;
    position:relative;
  }
  .crest::after{
    content:"";
    position:absolute;
    inset:-6px;
    border:1px dashed rgba(217,182,94,0.4);
    border-radius:50%;
  }
  .brand-text .name{
    font-family:var(--display);
    font-weight:600;
    font-size:19px;
    letter-spacing:0.3px;
  }
  .brand-text .motto{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gold-light);
    margin-top:2px;
  }
  .doc-no{
    font-family:var(--mono);
    font-size:11px;
    color:rgba(251,247,239,0.55);
    text-align:right;
    line-height:1.6;
  }

  /* ===== Page shell ===== */
  .shell{
    max-width:980px;
    margin:0 auto;
    background:var(--cream);
    min-height:100vh;
  }
  .layout{
    display:grid;
    grid-template-columns:190px 1fr;
    gap:0;
  }
  @media (max-width:720px){
    .layout{grid-template-columns:1fr;}
    .rail{
      display:flex;
      flex-direction:row;
      overflow-x:auto;
      gap:10px;
      padding:18px 16px !important;
    }
    .rail .stage{flex:0 0 auto;}
  }

  /* ===== Stamp rail ===== */
  .rail{
    background:var(--navy-deep);
    padding:28px 18px;
    display:flex;
    flex-direction:column;
    gap:6px;
    position:relative;
  }
  .rail-title{
    font-family:var(--mono);
    color:var(--gold-light);
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:14px;
    opacity:0.85;
  }
  .stage{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 6px;
    border-radius:6px;
    cursor:default;
    transition:background 0.2s ease;
  }
  .stage.clickable{cursor:pointer;}
  .stage.clickable:hover{background:rgba(255,255,255,0.05);}
  .stamp{
    width:30px;height:30px;
    border-radius:50%;
    border:2px solid rgba(217,182,94,0.35);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);
    font-size:11px;
    color:rgba(251,247,239,0.4);
    flex-shrink:0;
    transition:all 0.25s ease;
  }
  .stage.active .stamp{
    border-color:var(--gold-light);
    color:var(--gold-light);
    box-shadow:0 0 0 3px rgba(184,134,43,0.15);
  }
  .stage.done .stamp{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--navy-deep);
    transform:rotate(-8deg);
  }
  .stage-label{
    font-size:12px;
    color:rgba(251,247,239,0.45);
    font-weight:500;
  }
  .stage.active .stage-label{color:var(--cream);font-weight:600;}
  .stage.done .stage-label{color:rgba(251,247,239,0.75);}

  /* ===== Main paper ===== */
  .paper{
    background:var(--paper);
    padding:44px 48px 60px;
    position:relative;
  }
  .paper::before{
    content:"";
    position:absolute;
    left:0;top:0;bottom:0;
    width:1px;
    background:repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 6px, transparent 6px, transparent 12px);
  }
  @media (max-width:720px){ .paper{padding:32px 22px 50px;} }

  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:8px;
  }
  h1.step-title{
    font-family:var(--display);
    font-weight:600;
    font-size:30px;
    margin:0 0 6px;
    color:var(--navy);
  }
  p.step-sub{
    color:var(--ink-soft);
    font-size:14.5px;
    margin:0 0 32px;
    max-width:520px;
    line-height:1.55;
  }

  /* ===== Fields ===== */
  .field{margin-bottom:22px;}
  .field label{
    display:block;
    font-family:var(--mono);
    font-size:11.5px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:var(--navy);
    margin-bottom:7px;
    font-weight:700;
  }
  .field .hint{
    font-family:var(--body);
    text-transform:none;
    font-weight:400;
    color:var(--ink-soft);
    font-size:12.5px;
    letter-spacing:0;
    display:block;
    margin-top:3px;
  }
  input[type=text], input[type=email], input[type=tel], input[type=date], input[type=number], select, textarea{
    width:100%;
    padding:11px 13px;
    border:1.5px solid var(--line);
    border-radius:4px;
    background:#fff;
    font-family:var(--body);
    font-size:14.5px;
    color:var(--ink);
    transition:border-color 0.15s ease;
  }
  input:focus, select:focus, textarea:focus{
    outline:none;
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(184,134,43,0.12);
  }
  textarea{resize:vertical;min-height:90px;font-family:var(--body);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:560px){.row2{grid-template-columns:1fr;}}

  .choice-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .choice{
    border:1.5px solid var(--line);
    background:#fff;
    border-radius:20px;
    padding:9px 16px;
    font-size:13.5px;
    cursor:pointer;
    user-select:none;
    transition:all 0.15s ease;
    display:flex;align-items:center;gap:7px;
  }
  .choice input{accent-color:var(--navy);width:14px;height:14px;}
  .choice.picked{
    border-color:var(--navy);
    background:var(--navy);
    color:var(--cream);
  }
  .choice.picked input{accent-color:var(--gold-light);}

  .subpanel{
    margin-top:14px;
    padding:16px 18px;
    background:rgba(184,134,43,0.06);
    border-left:3px solid var(--gold);
    border-radius:0 6px 6px 0;
  }
  .subpanel .field:last-child{margin-bottom:0;}

  .file-row{
    display:flex;align-items:center;gap:12px;
    border:1.5px dashed var(--line);
    border-radius:6px;
    padding:14px 16px;
    background:#fff;
  }
  .file-row input[type=file]{font-family:var(--body);font-size:13px;flex:1;}
  .file-badge{
    font-family:var(--mono);
    font-size:10px;
    background:var(--teal);
    color:#fff;
    padding:3px 8px;
    border-radius:10px;
    white-space:nowrap;
  }

  .consent-box{
    border:1.5px solid var(--line);
    border-radius:6px;
    padding:18px;
    background:#fff;
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .consent-box input{margin-top:3px;accent-color:var(--navy);width:16px;height:16px;flex-shrink:0;}
  .consent-box p{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink-soft);}

  /* ===== Nav buttons ===== */
  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:38px;
    padding-top:24px;
    border-top:1px solid var(--line);
  }
  button{
    font-family:var(--body);
    font-weight:600;
    font-size:14px;
    border-radius:5px;
    padding:12px 24px;
    cursor:pointer;
    border:none;
    transition:all 0.15s ease;
  }
  .btn-primary{
    background:var(--navy);
    color:var(--cream);
  }
  .btn-primary:hover{background:var(--navy-deep);}
  .btn-ghost{
    background:transparent;
    color:var(--navy);
    border:1.5px solid var(--line);
  }
  .btn-ghost:hover{border-color:var(--navy);}
  .btn-gold{
    background:var(--gold);
    color:var(--navy-deep);
  }
  .btn-gold:hover{background:var(--gold-light);}
  .invisible{visibility:hidden;}

  /* ===== Welcome ===== */
  .welcome{
    text-align:left;
  }
  .welcome h1{
    font-family:var(--display);
    font-size:38px;
    font-weight:600;
    color:var(--navy);
    margin:0 0 14px;
    line-height:1.15;
  }
  .welcome p.lead{
    font-size:15.5px;
    color:var(--ink-soft);
    max-width:560px;
    line-height:1.65;
    margin-bottom:26px;
  }
  .pill-list{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:34px;}
  .pill{
    font-family:var(--mono);
    font-size:11.5px;
    letter-spacing:0.3px;
    border:1px solid var(--gold);
    color:var(--burgundy);
    padding:6px 13px;
    border-radius:14px;
    background:rgba(184,134,43,0.07);
  }

  /* ===== Review ===== */
  .review-block{margin-bottom:26px;}
  .review-block h3{
    font-family:var(--mono);
    font-size:11.5px;
    letter-spacing:1.2px;
    text-transform:uppercase;
    color:var(--gold);
    border-bottom:1px solid var(--line);
    padding-bottom:8px;
    margin-bottom:12px;
  }
  .review-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 24px;
  }
  @media (max-width:560px){.review-grid{grid-template-columns:1fr;}}
  .review-item dt{
    font-size:11px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.4px;
    font-family:var(--mono);
  }
  .review-item dd{
    margin:2px 0 0;
    font-size:14px;
    color:var(--ink);
  }
  .review-item dd:empty::after{content:"—";color:var(--ink-soft);}

  .seal{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:var(--teal);
    color:#fff;
    padding:10px 18px;
    border-radius:6px;
    font-family:var(--mono);
    font-size:12.5px;
    letter-spacing:0.5px;
    margin-bottom:24px;
  }

  .download-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }

  /* Print styles: only the printable summary shows */
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{
      display:block;
      position:absolute;
      left:0;top:0;
      width:100%;
      padding:20px;
    }
  }
</style>
</head>
<body>

<div class="coverbar">
  <div class="brand">
    <div class="crest">MSA</div>
    <div class="brand-text">
      <div class="name">More Success Academy</div>
      <div class="motto">Achieving Educational &amp; Career Milestones</div>
    </div>
  </div>
  <div class="doc-no">
    GLOBAL ADMISSIONS &amp; SCHOLARSHIP<br>MENTORSHIP INTAKE
  </div>
</div>

<div class="shell">
  <div class="layout">
    <div class="rail" id="rail"></div>
    <div class="paper" id="paper"></div>
  </div>
</div>

<!-- Hidden printable summary, populated on demand -->
<div id="printArea"></div>

<script>
(function(){

  var stageDefs = [
    {key:'welcome', label:'Welcome'},
    {key:'personal', label:'Personal Info'},
    {key:'academic', label:'Academic Profile'},
    {key:'career', label:'Career Goals'},
    {key:'country', label:'Country Preference'},
    {key:'finance', label:'Financial Capacity'},
    {key:'scholarship', label:'Scholarships'},
    {key:'work', label:'Work Experience'},
    {key:'documents', label:'Documents'},
    {key:'consent', label:'Consent'},
    {key:'review', label:'Review & Download'}
  ];

  var state = {
    fullName:'', dob:'', email:'', phone:'', country:'', city:'', address:'',
    highestQual:'', institution:'', fieldOfStudy:'', gradeClass:'', gradYear:'',
    targetCareer:'', shortGoal:'', longGoal:'',
    countries:[], canadaPGWP:'', ukGradRoute:'', usaTest:'',
    budget:'', fundingSource:'', guarantor:'',
    seekingScholarship:'', scholarshipTypes:[], scholarshipApplied:'',
    yearsExp:'', currentRole:'', achievements:'',
    fileTranscript:'', fileCV:'', filePassport:'', filePhoto:'',
    consentComms:false, consentAccuracy:false, signature:''
  };

  var currentIndex = 0;
  var maxReached = 0;

  function el(tag, attrs, children){
    var e = document.createElement(tag);
    if(attrs) for(var k in attrs){
      if(k === 'class') e.className = attrs[k];
      else if(k === 'html') e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(function(c){ if(c) e.appendChild(c); });
    return e;
  }

  function field(labelText, inputEl, hint){
    var wrap = el('div', {class:'field'});
    var lab = el('label', {}, [document.createTextNode(labelText)]);
    if(hint) lab.appendChild(el('span', {class:'hint'}, [document.createTextNode(hint)]));
    wrap.appendChild(lab);
    wrap.appendChild(inputEl);
    return wrap;
  }

  function textInput(type, key, placeholder){
    var i = el('input', {type:type, placeholder:placeholder||''});
    i.value = state[key] || '';
    i.addEventListener('input', function(){ state[key] = i.value; });
    return i;
  }

  function textarea(key, placeholder, rows){
    var t = el('textarea', {placeholder:placeholder||'', rows: rows||3});
    t.value = state[key] || '';
    t.addEventListener('input', function(){ state[key] = t.value; });
    return t;
  }

  function selectInput(key, options){
    var s = el('select', {});
    s.appendChild(el('option', {value:''}, [document.createTextNode('Select…')]));
    options.forEach(function(opt){
      var o = el('option', {value:opt}, [document.createTextNode(opt)]);
      if(state[key] === opt) o.setAttribute('selected','selected');
      s.appendChild(o);
    });
    s.addEventListener('change', function(){ state[key] = s.value; render(); });
    return s;
  }

  function choiceGroup(key, options, multi){
    var wrap = el('div', {class:'choice-grid'});
    options.forEach(function(opt){
      var isPicked = multi ? state[key].indexOf(opt) > -1 : state[key] === opt;
      var input = el('input', {type: multi ? 'checkbox' : 'radio', name:key});
      input.checked = isPicked;
      var label = el('label', {class:'choice' + (isPicked ? ' picked' : '')}, [input, document.createTextNode(opt)]);
      label.addEventListener('click', function(e){
        e.preventDefault();
        if(multi){
          var arr = state[key];
          var idx = arr.indexOf(opt);
          if(idx > -1) arr.splice(idx,1); else arr.push(opt);
        } else {
          state[key] = opt;
        }
        render();
      });
      wrap.appendChild(label);
    });
    return wrap;
  }

  function sectionHeader(eyebrow, title, sub){
    var frag = document.createDocumentFragment();
    frag.appendChild(el('div', {class:'eyebrow'}, [document.createTextNode(eyebrow)]));
    frag.appendChild(el('h1', {class:'step-title'}, [document.createTextNode(title)]));
    if(sub) frag.appendChild(el('p', {class:'step-sub'}, [document.createTextNode(sub)]));
    return frag;
  }

  function navRow(showBack){
    var row = el('div', {class:'nav-row'});
    var back = el('button', {class:'btn-ghost' + (showBack ? '' : ' invisible')}, [document.createTextNode('← Back')]);
    back.addEventListener('click', function(){ goTo(currentIndex - 1); });
    var nextLabel = currentIndex === stageDefs.length - 2 ? 'Review Application →' : 'Continue →';
    var next = el('button', {class:'btn-primary'}, [document.createTextNode(nextLabel)]);
    next.addEventListener('click', function(){ goTo(currentIndex + 1); });
    row.appendChild(back);
    row.appendChild(next);
    return row;
  }

  function fileRow(key, label, accept){
    var wrap = el('div', {class:'field'});
    wrap.appendChild(el('label', {}, [document.createTextNode(label)]));
    var frow = el('div', {class:'file-row'});
    var input = el('input', {type:'file', accept: accept || ''});
    input.addEventListener('change', function(){
      state[key] = input.files.length ? input.files[0].name : '';
      badge.textContent = state[key] ? 'Selected' : 'No file';
      badge.style.background = state[key] ? 'var(--teal)' : '#999';
    });
    var badge = el('span', {class:'file-badge'}, [document.createTextNode(state[key] ? 'Selected' : 'No file')]);
    frow.appendChild(input);
    frow.appendChild(badge);
    wrap.appendChild(frow);
    wrap.appendChild(el('span', {class:'hint', style:'display:block;margin-top:6px;'}, [document.createTextNode('Note: this demo form captures the file name only. Connect a backend to store the actual document.')]));
    return wrap;
  }

  // ---- Stage renderers ----
  var renderers = {

    welcome: function(container){
      var w = el('div', {class:'welcome'});
      w.appendChild(el('div', {class:'eyebrow'}, [document.createTextNode('MSA · GLOBAL ADMISSIONS & SCHOLARSHIP MENTORSHIP')]));
      w.appendChild(el('h1', {}, [document.createTextNode('Start your international journey with confidence.')]));
      w.appendChild(el('p', {class:'lead'}, [document.createTextNode('This intake takes about 8–10 minutes. Your answers help your mentor build a school shortlist, a scholarship shortlist, and a personalised roadmap — instead of applying blindly.')]));
      var pills = el('div', {class:'pill-list'});
      ['School Selection','Scholarships','SOP Writing','CV Optimisation','Funding Strategy','Visa Preparation','Career Positioning'].forEach(function(p){
        pills.appendChild(el('span', {class:'pill'}, [document.createTextNode(p)]));
      });
      w.appendChild(pills);
      var start = el('button', {class:'btn-primary'}, [document.createTextNode('Begin Application →')]);
      start.addEventListener('click', function(){ goTo(1); });
      w.appendChild(start);
      container.appendChild(w);
    },

    personal: function(container){
      container.appendChild(sectionHeader('SECTION 01', 'Personal Information', 'Basic details we use to identify and correspond with you.'));
      var row1 = el('div', {class:'row2'});
      row1.appendChild(field('Full Legal Name', textInput('text','fullName','As it appears on your passport')));
      row1.appendChild(field('Date of Birth', textInput('date','dob')));
      container.appendChild(row1);
      var row2 = el('div', {class:'row2'});
      row2.appendChild(field('Email Address', textInput('email','email','you@example.com')));
      row2.appendChild(field('Phone / WhatsApp Number', textInput('tel','phone','+234...')));
      container.appendChild(row2);
      var row3 = el('div', {class:'row2'});
      row3.appendChild(field('Country of Residence', textInput('text','country')));
      row3.appendChild(field('City', textInput('text','city')));
      container.appendChild(row3);
      container.appendChild(field('Full Home Address', textarea('address','Street, city, state', 2)));
      container.appendChild(navRow(false));
    },

    academic: function(container){
      container.appendChild(sectionHeader('SECTION 02', 'Academic Profile', 'Your most recent qualification and academic performance.'));
      container.appendChild(field('Highest Qualification', selectInput('highestQual', ['Secondary School','Bachelor\'s Degree','Master\'s Degree','HND','Other'])));
      var row1 = el('div', {class:'row2'});
      row1.appendChild(field('Institution Attended', textInput('text','institution')));
      row1.appendChild(field('Field of Study / Major', textInput('text','fieldOfStudy')));
      container.appendChild(row1);
      var row2 = el('div', {class:'row2'});
      row2.appendChild(field('CGPA / Class of Degree', textInput('text','gradeClass','e.g. 3.31/5.0, Second Class Lower')));
      row2.appendChild(field('Graduation Year', textInput('number','gradYear','2025')));
      container.appendChild(row2);
      container.appendChild(navRow(true));
    },

    career: function(container){
      container.appendChild(sectionHeader('SECTION 03', 'Career Goals', 'Where you want to go, and why this matters to you.'));
      container.appendChild(field('Target Career Path', textInput('text','targetCareer','e.g. Data Science, Occupational Health & Safety, Software Engineering')));
      container.appendChild(field('Short-Term Goal (1–2 years after graduating)', textarea('shortGoal','', 2)));
      container.appendChild(field('Long-Term Goal (5–10 years)', textarea('longGoal','', 2)));
      container.appendChild(navRow(true));
    },

    country: function(container){
      container.appendChild(sectionHeader('SECTION 04', 'Country Preferences', 'Select every country you are seriously considering.'));
      container.appendChild(field('Preferred Study Destinations', choiceGroup('countries', ['Canada','United Kingdom','United States','Ireland','Germany','Australia','Other'], true)));

      if(state.countries.indexOf('Canada') > -1){
        var p1 = el('div', {class:'subpanel'});
        p1.appendChild(field('Canada selected — is the Post-Graduation Work Permit (PGWP) pathway a priority for you?', choiceGroup('canadaPGWP', ['Yes','No','Not sure yet'], false)));
        container.appendChild(p1);
      }
      if(state.countries.indexOf('United Kingdom') > -1){
        var p2 = el('div', {class:'subpanel'});
        p2.appendChild(field('UK selected — are you planning to use the Graduate Route (post-study work) visa?', choiceGroup('ukGradRoute', ['Yes','No','Not sure yet'], false)));
        container.appendChild(p2);
      }
      if(state.countries.indexOf('United States') > -1){
        var p3 = el('div', {class:'subpanel'});
        p3.appendChild(field('USA selected — do you plan to take the GRE / GMAT?', choiceGroup('usaTest', ['Already taken','Planning to take','Not required for my program','Not sure yet'], false)));
        container.appendChild(p3);
      }
      container.appendChild(navRow(true));
    },

    finance: function(container){
      container.appendChild(sectionHeader('SECTION 05', 'Financial Capacity', 'Be realistic here — this shapes what we recommend.'));
      container.appendChild(field('Estimated Annual Budget Available (tuition + living)', textInput('text','budget','e.g. CAD $18,000 / USD $25,000')));
      container.appendChild(field('Primary Funding Source', choiceGroup('fundingSource', ['Self','Family','Sponsor','Loan','Mixed Funding'], false)));
      if(state.fundingSource === 'Loan' || state.fundingSource === 'Mixed Funding'){
        var p = el('div', {class:'subpanel'});
        p.appendChild(field('If a loan is involved — do you already have a guarantor?', choiceGroup('guarantor', ['Yes','No','Not sure yet'], false)));
        container.appendChild(p);
      }
      container.appendChild(navRow(true));
    },

    scholarship: function(container){
      container.appendChild(sectionHeader('SECTION 06', 'Scholarships', 'Reducing financial pressure is often as important as admission itself.'));
      container.appendChild(field('Are you actively seeking scholarships or funding awards?', choiceGroup('seekingScholarship', ['Yes','No','Open to it'], false)));
      container.appendChild(field('Scholarship Types of Interest', choiceGroup('scholarshipTypes', ['Merit-based','Need-based','Graduate Assistantship','Government-funded','Institutional Entrance Award'], true)));
      container.appendChild(field('Any scholarships you\'ve already applied for or won?', textarea('scholarshipApplied','', 2)));
      container.appendChild(navRow(true));
    },

    work: function(container){
      container.appendChild(sectionHeader('SECTION 07', 'Work Experience', 'Even internships and volunteer roles count.'));
      container.appendChild(field('Years of Relevant Work Experience', textInput('text','yearsExp','e.g. 1.5 years')));
      container.appendChild(field('Current / Most Recent Role', textInput('text','currentRole')));
      container.appendChild(field('Key Achievements or Responsibilities', textarea('achievements','', 3)));
      container.appendChild(navRow(true));
    },

    documents: function(container){
      container.appendChild(sectionHeader('SECTION 08', 'Documents Upload', 'Upload what you have now — you can add the rest later.'));
      container.appendChild(fileRow('fileTranscript','Academic Transcript'));
      container.appendChild(fileRow('fileCV','CV / Resume'));
      container.appendChild(fileRow('filePassport','Passport Bio Page'));
      container.appendChild(fileRow('filePhoto','Passport Photograph', 'image/*'));
      container.appendChild(navRow(true));
    },

    consent: function(container){
      container.appendChild(sectionHeader('SECTION 09', 'Consent', 'Almost done — just confirm the following.'));
      var c1 = el('div', {class:'consent-box'});
      var i1 = el('input', {type:'checkbox'});
      i1.checked = state.consentAccuracy;
      i1.addEventListener('change', function(){ state.consentAccuracy = i1.checked; });
      c1.appendChild(i1);
      c1.appendChild(el('p', {}, [document.createTextNode('I confirm that the information provided in this form is accurate and complete to the best of my knowledge.')]));
      container.appendChild(el('div', {class:'field'}, [c1]));

      var c2 = el('div', {class:'consent-box'});
      var i2 = el('input', {type:'checkbox'});
      i2.checked = state.consentComms;
      i2.addEventListener('change', function(){ state.consentComms = i2.checked; });
      c2.appendChild(i2);
      c2.appendChild(el('p', {}, [document.createTextNode('I agree that More Success Academy may contact me by email, phone, or WhatsApp regarding my mentorship application.')]));
      container.appendChild(el('div', {class:'field'}, [c2]));

      container.appendChild(field('Type your full name as your signature', textInput('text','signature','Full name')));
      container.appendChild(navRow(true));
    },

    review: function(container){
      container.appendChild(sectionHeader('FINAL STEP', 'Review & Download', 'Check everything below, then download your completed application to send to your mentor.'));

      container.appendChild(el('div', {class:'seal'}, [document.createTextNode('✓ APPLICATION COMPLETE — READY TO DOWNLOAD')]));

      var blocks = [
        {title:'Personal Information', items:[
          ['Full Name', state.fullName],['Date of Birth', state.dob],['Email', state.email],
          ['Phone', state.phone],['Country', state.country],['City', state.city],['Address', state.address]
        ]},
        {title:'Academic Profile', items:[
          ['Highest Qualification', state.highestQual],['Institution', state.institution],
          ['Field of Study', state.fieldOfStudy],['CGPA / Class', state.gradeClass],['Graduation Year', state.gradYear]
        ]},
        {title:'Career Goals', items:[
          ['Target Career', state.targetCareer],['Short-Term Goal', state.shortGoal],['Long-Term Goal', state.longGoal]
        ]},
        {title:'Country Preferences', items:[
          ['Countries', state.countries.join(', ')],['Canada — PGWP priority', state.canadaPGWP],
          ['UK — Graduate Route', state.ukGradRoute],['USA — GRE/GMAT', state.usaTest]
        ]},
        {title:'Financial Capacity', items:[
          ['Annual Budget', state.budget],['Funding Source', state.fundingSource],['Guarantor', state.guarantor]
        ]},
        {title:'Scholarships', items:[
          ['Seeking Scholarships', state.seekingScholarship],['Types of Interest', state.scholarshipTypes.join(', ')],
          ['Already Applied For', state.scholarshipApplied]
        ]},
        {title:'Work Experience', items:[
          ['Years of Experience', state.yearsExp],['Current Role', state.currentRole],['Achievements', state.achievements]
        ]},
        {title:'Documents', items:[
          ['Transcript', state.fileTranscript],['CV', state.fileCV],['Passport Bio Page', state.filePassport],['Passport Photo', state.filePhoto]
        ]},
        {title:'Consent', items:[
          ['Accuracy Confirmed', state.consentAccuracy ? 'Yes' : 'No'],
          ['Communication Consent', state.consentComms ? 'Yes' : 'No'],
          ['Signature', state.signature]
        ]}
      ];

      blocks.forEach(function(b){
        var block = el('div', {class:'review-block'});
        block.appendChild(el('h3', {}, [document.createTextNode(b.title)]));
        var grid = el('div', {class:'review-grid'});
        b.items.forEach(function(pair){
          var item = el('div', {class:'review-item'});
          item.appendChild(el('dt', {}, [document.createTextNode(pair[0])]));
          item.appendChild(el('dd', {}, [document.createTextNode(pair[1] || '')]));
          grid.appendChild(item);
        });
        block.appendChild(grid);
        container.appendChild(block);
      });

      var dlRow = el('div', {class:'download-row'});
      var pdfBtn = el('button', {class:'btn-gold'}, [document.createTextNode('⬇ Download as PDF')]);
      pdfBtn.addEventListener('click', downloadPDF);
      var txtBtn = el('button', {class:'btn-ghost'}, [document.createTextNode('⬇ Download as Text File')]);
      txtBtn.addEventListener('click', downloadText);
      dlRow.appendChild(pdfBtn);
      dlRow.appendChild(txtBtn);
      container.appendChild(dlRow);

      var backRow = el('div', {class:'nav-row'});
      var back = el('button', {class:'btn-ghost'}, [document.createTextNode('← Edit Answers')]);
      back.addEventListener('click', function(){ goTo(currentIndex - 1); });
      backRow.appendChild(back);
      backRow.appendChild(el('span'));
      container.appendChild(backRow);

      buildPrintArea(blocks);
    }
  };

  function buildPrintArea(blocks){
    var area = document.getElementById('printArea');
    area.innerHTML = '';
    var header = document.createElement('div');
    header.style.borderBottom = '3px solid #B8862B';
    header.style.paddingBottom = '14px';
    header.style.marginBottom = '18px';
    header.innerHTML = '<div style="font-family:Fraunces,serif;font-size:22px;font-weight:600;color:#14213D;">More Success Academy</div>' +
      '<div style="font-family:monospace;font-size:11px;letter-spacing:1px;color:#B8862B;text-transform:uppercase;">Global Admissions &amp; Scholarship Mentorship — Intake Summary</div>' +
      '<div style="font-family:monospace;font-size:10px;color:#666;margin-top:4px;">Generated: ' + new Date().toLocaleDateString() + '</div>';
    area.appendChild(header);
    blocks.forEach(function(b){
      var h = document.createElement('h3');
      h.style.fontFamily = 'monospace';
      h.style.fontSize = '11px';
      h.style.letterSpacing = '1px';
      h.style.textTransform = 'uppercase';
      h.style.color = '#B8862B';
      h.style.borderBottom = '1px solid #DCD4C2';
      h.style.paddingBottom = '6px';
      h.style.marginTop = '18px';
      h.textContent = b.title;
      area.appendChild(h);
      b.items.forEach(function(pair){
        var row = document.createElement('div');
        row.style.fontSize = '12.5px';
        row.style.margin = '4px 0';
        row.innerHTML = '<strong>' + pair[0] + ':</strong> ' + (pair[1] || '—');
        area.appendChild(row);
      });
    });
  }

  function downloadPDF(){
    window.print();
  }

  function downloadText(){
    var lines = ['MORE SUCCESS ACADEMY — GLOBAL ADMISSIONS & SCHOLARSHIP MENTORSHIP', 'Intake Summary — Generated ' + new Date().toLocaleString(), ''];
    var area = document.getElementById('printArea');
    area.querySelectorAll('h3, div').forEach(function(node){
      if(node.tagName === 'H3') lines.push('\n' + node.textContent.toUpperCase());
      else lines.push(node.textContent);
    });
    var blob = new Blob([lines.join('\n')], {type:'text/plain'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    var safeName = (state.fullName || 'applicant').replace(/[^a-z0-9]/gi,'_');
    a.download = 'MSA_Intake_' + safeName + '.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function renderRail(){
    var rail = document.getElementById('rail');
    rail.innerHTML = '';
    rail.appendChild(el('div', {class:'rail-title'}, [document.createTextNode('APPLICATION STAGES')]));
    stageDefs.forEach(function(s, idx){
      if(idx === 0) return; // skip welcome in rail
      var status = idx === currentIndex ? 'active' : (idx < currentIndex || idx <= maxReached ? 'done' : '');
      if(idx === currentIndex) status = 'active';
      var stage = el('div', {class:'stage ' + status + (idx <= maxReached ? ' clickable' : '')});
      var num = idx < currentIndex ? '✓' : String(idx).padStart(2,'0');
      stage.appendChild(el('div', {class:'stamp'}, [document.createTextNode(num)]));
      stage.appendChild(el('div', {class:'stage-label'}, [document.createTextNode(s.label)]));
      if(idx <= maxReached){
        stage.addEventListener('click', function(){ goTo(idx); });
      }
      rail.appendChild(stage);
    });
  }

  function render(){
    var paper = document.getElementById('paper');
    paper.innerHTML = '';
    var key = stageDefs[currentIndex].key;
    renderers[key](paper);
    renderRail();
    window.scrollTo(0,0);
  }

  function goTo(idx){
    if(idx < 0) idx = 0;
    if(idx > stageDefs.length - 1) idx = stageDefs.length - 1;
    currentIndex = idx;
    if(idx > maxReached) maxReached = idx;
    render();
  }

  render();
})();
</script>

</body>
</html>
