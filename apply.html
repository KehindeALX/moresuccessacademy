<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>More Success Academy — Global Admissions & Scholarship Mentorship Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#050B2E;
    --navy-deep:#03071A;
    --cream:#FBF7EF;
    --paper:#FFFDF8;
    --gold:#D4AF37;
    --gold-light:#E6C666;
    --burgundy:#6E2C2C;
    --teal:#1F4B43;
    --ink:#22252B;
    --ink-soft:#5B5F6B;
    --line:#DCD4C2;
    --display: 'Fraunces', serif;
    --mono: 'Space Mono', monospace;
    --body: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--body);
    background:var(--navy);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  /* ===== Cover bar ===== */
  .coverbar{
    background:linear-gradient(180deg,var(--navy) 0%, var(--navy-deep) 100%);
    color:var(--cream);
    padding:22px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:3px solid var(--gold);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .crest-img{
    width:44px;height:44px;border-radius:50%;
    border:2px solid var(--gold-light);
    object-fit:cover;
    flex-shrink:0;
    background:var(--navy-deep);
  }
  .brand-text .name{
    font-family:var(--display);
    font-weight:600;
    font-size:19px;
    letter-spacing:0.3px;
  }
  .brand-text .motto{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gold-light);
    margin-top:2px;
  }
  .doc-no{
    font-family:var(--mono);
    font-size:11px;
    color:rgba(251,247,239,0.55);
    text-align:right;
    line-height:1.6;
  }

  /* ===== Page shell ===== */
  .shell{
    max-width:980px;
    margin:0 auto;
    background:var(--cream);
    min-height:100vh;
  }

  /* ===== Progress bar ===== */
  .progress-shell{
    background:var(--navy-deep);
    padding:14px 24px 16px;
    border-bottom:1px solid rgba(217,182,94,0.2);
  }
  .progress-toprow{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }
  .progress-toprow .ptitle{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:rgba(251,247,239,0.55);
  }
  .progress-toprow .pstat{
    font-family:var(--mono);
    font-size:11px;
    color:var(--gold-light);
    letter-spacing:0.3px;
  }
  .progress-track{
    height:6px;
    border-radius:4px;
    background:rgba(255,255,255,0.09);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 100%);
    border-radius:4px;
    transition:width 0.45s cubic-bezier(.4,0,.2,1);
  }

  /* ===== Trust bar (motivation strip) ===== */
  .trust-bar{
    display:flex;
    flex-wrap:wrap;
    gap:8px 22px;
    padding:11px 24px;
    background:rgba(184,134,43,0.06);
    border-bottom:1px solid var(--line);
  }
  .trust-item{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11.5px;
    color:var(--ink-soft);
    font-family:var(--body);
  }
  .trust-item .check{
    color:var(--gold);
    font-weight:700;
  }
  @media (max-width:560px){
    .trust-bar{padding:9px 16px;gap:5px 14px;}
    .trust-item{font-size:10.5px;}
  }

  /* ===== Autosave toast ===== */
  .autosave-toast{
    position:fixed;
    bottom:18px;
    right:18px;
    background:var(--navy);
    color:var(--cream);
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.3px;
    padding:9px 16px;
    border-radius:20px;
    border:1px solid var(--gold);
    opacity:0;
    transform:translateY(8px);
    transition:opacity 0.3s ease, transform 0.3s ease;
    pointer-events:none;
    z-index:50;
  }
  .autosave-toast.show{opacity:1;transform:translateY(0);}
  @media (max-width:560px){
    .autosave-toast{left:16px;right:16px;bottom:14px;text-align:center;}
  }

  /* Step transition */
  .step-enter{animation:stepFade 0.3s ease;}
  @keyframes stepFade{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }

  .layout{
    display:grid;
    grid-template-columns:190px 1fr;
    gap:0;
  }
  @media (max-width:720px){
    .layout{grid-template-columns:1fr;}
    .rail{
      display:flex;
      flex-direction:row;
      overflow-x:auto;
      gap:10px;
      padding:18px 16px !important;
    }
    .rail .stage{flex:0 0 auto;}
  }

  /* ===== Stamp rail ===== */
  .rail{
    background:var(--navy-deep);
    padding:28px 18px;
    display:flex;
    flex-direction:column;
    gap:6px;
    position:relative;
  }
  .rail-title{
    font-family:var(--mono);
    color:var(--gold-light);
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:14px;
    opacity:0.85;
  }
  .stage{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 6px;
    border-radius:6px;
    cursor:default;
    transition:background 0.2s ease;
  }
  .stage.clickable{cursor:pointer;}
  .stage.clickable:hover{background:rgba(255,255,255,0.05);}
  .marker-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    flex-shrink:0;
  }
  .connector{
    width:2px;
    height:14px;
    background:rgba(217,182,94,0.18);
    transition:background 0.3s ease;
  }
  .connector.filled{background:var(--gold);}
  @media (max-width:720px){
    .marker-col{flex-direction:row;}
    .connector{display:none;}
  }
  .stamp{
    width:30px;height:30px;
    border-radius:50%;
    border:2px solid rgba(217,182,94,0.35);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);
    font-size:11px;
    color:rgba(251,247,239,0.4);
    flex-shrink:0;
    transition:all 0.25s ease;
  }
  .stage.active .stamp{
    border-color:var(--gold-light);
    color:var(--gold-light);
    box-shadow:0 0 0 3px rgba(184,134,43,0.15);
  }
  .stage.done .stamp{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--navy-deep);
    transform:rotate(-8deg);
  }
  .stage-label{
    font-size:12px;
    color:rgba(251,247,239,0.45);
    font-weight:500;
  }
  .stage.active .stage-label{color:var(--cream);font-weight:600;}
  .stage.done .stage-label{color:rgba(251,247,239,0.75);}

  /* ===== Main paper ===== */
  .paper{
    background:var(--paper);
    padding:44px 48px 60px;
    position:relative;
  }
  .paper::before{
    content:"";
    position:absolute;
    left:0;top:0;bottom:0;
    width:1px;
    background:repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 6px, transparent 6px, transparent 12px);
  }
  @media (max-width:720px){ .paper{padding:32px 22px 50px;} }

  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:8px;
  }
  h1.step-title{
    font-family:var(--display);
    font-weight:600;
    font-size:30px;
    margin:0 0 6px;
    color:var(--navy);
  }
  p.step-sub{
    color:var(--ink-soft);
    font-size:14.5px;
    margin:0 0 32px;
    max-width:520px;
    line-height:1.55;
  }

  /* ===== Fields ===== */
  .field{margin-bottom:22px;}
  .field label{
    display:block;
    font-family:var(--mono);
    font-size:11.5px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:var(--navy);
    margin-bottom:7px;
    font-weight:700;
  }
  .field .hint{
    font-family:var(--body);
    text-transform:none;
    font-weight:400;
    color:var(--ink-soft);
    font-size:12.5px;
    letter-spacing:0;
    display:block;
    margin-top:3px;
  }
  input[type=text], input[type=email], input[type=tel], input[type=date], input[type=number], select, textarea{
    width:100%;
    padding:11px 13px;
    border:1.5px solid var(--line);
    border-radius:4px;
    background:#fff;
    font-family:var(--body);
    font-size:14.5px;
    color:var(--ink);
    transition:border-color 0.15s ease;
  }
  input:focus, select:focus, textarea:focus{
    outline:none;
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(184,134,43,0.12);
  }
  textarea{resize:vertical;min-height:90px;font-family:var(--body);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:560px){.row2{grid-template-columns:1fr;}}

  .choice-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .choice{
    border:1.5px solid var(--line);
    background:#fff;
    border-radius:20px;
    padding:9px 16px;
    font-size:13.5px;
    cursor:pointer;
    user-select:none;
    transition:all 0.15s ease;
    display:flex;align-items:center;gap:7px;
  }
  .choice input{accent-color:var(--navy);width:14px;height:14px;}
  .choice.picked{
    border-color:var(--navy);
    background:var(--navy);
    color:var(--cream);
  }
  .choice.picked input{accent-color:var(--gold-light);}

  .subpanel{
    margin-top:14px;
    padding:16px 18px;
    background:rgba(184,134,43,0.06);
    border-left:3px solid var(--gold);
    border-radius:0 6px 6px 0;
  }
  .subpanel .field:last-child{margin-bottom:0;}

  .file-row{
    display:flex;align-items:center;gap:12px;
    border:1.5px dashed var(--line);
    border-radius:6px;
    padding:14px 16px;
    background:#fff;
  }
  .file-row input[type=file]{font-family:var(--body);font-size:13px;flex:1;}
  .file-badge{
    font-family:var(--mono);
    font-size:10px;
    background:var(--teal);
    color:#fff;
    padding:3px 8px;
    border-radius:10px;
    white-space:nowrap;
  }

  .consent-box{
    border:1.5px solid var(--line);
    border-radius:6px;
    padding:18px;
    background:#fff;
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .consent-box input{margin-top:3px;accent-color:var(--navy);width:16px;height:16px;flex-shrink:0;}
  .consent-box p{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink-soft);}

  /* ===== Nav buttons ===== */
  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:38px;
    padding-top:24px;
    border-top:1px solid var(--line);
  }
  button{
    font-family:var(--body);
    font-weight:600;
    font-size:14px;
    border-radius:5px;
    padding:12px 24px;
    cursor:pointer;
    border:none;
    transition:all 0.15s ease;
  }
  button:disabled{opacity:0.55;cursor:not-allowed;}
  .btn-primary{
    background:var(--navy);
    color:var(--cream);
  }
  .btn-primary:hover{background:var(--navy-deep);}
  .btn-ghost{
    background:transparent;
    color:var(--navy);
    border:1.5px solid var(--line);
  }
  .btn-ghost:hover{border-color:var(--navy);}
  .btn-gold{
    background:var(--gold);
    color:var(--navy-deep);
  }
  .btn-gold:hover{background:var(--gold-light);}
  .invisible{visibility:hidden;}

  /* ===== Welcome ===== */
  .welcome{
    text-align:left;
  }
  .welcome-hero-img{
    width:100%;
    max-height:260px;
    object-fit:cover;
    border-radius:10px;
    display:block;
    margin:16px 0 24px;
    border:1px solid var(--line);
  }
  .step-banner-img{
    width:100%;
    max-height:170px;
    object-fit:cover;
    border-radius:8px;
    display:block;
    margin:0 0 26px;
    border:1px solid var(--line);
  }
  .welcome h1{
    font-family:var(--display);
    font-size:38px;
    font-weight:600;
    color:var(--navy);
    margin:0 0 14px;
    line-height:1.15;
  }
  .welcome p.lead{
    font-size:15.5px;
    color:var(--ink-soft);
    max-width:560px;
    line-height:1.65;
    margin-bottom:26px;
  }
  .pill-list{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:34px;}
  .pill{
    font-family:var(--mono);
    font-size:11.5px;
    letter-spacing:0.3px;
    border:1px solid var(--gold);
    color:var(--burgundy);
    padding:6px 13px;
    border-radius:14px;
    background:rgba(184,134,43,0.07);
  }

  /* ===== Journey roadmap (welcome hero) ===== */
  .journey-map{
    margin:6px 0 30px;
    max-width:620px;
  }
  .journey-svg{width:100%;height:auto;display:block;}
  .journey-road{
    stroke-dasharray:2 9;
    animation:roadCrawl 2.4s linear infinite;
  }
  @keyframes roadCrawl{ to{ stroke-dashoffset:-33; } }
  .journey-label{
    font-family:var(--mono);
    font-size:9.5px;
    letter-spacing:0.4px;
    fill:var(--ink-soft);
    text-transform:uppercase;
  }
  .journey-endpoint-label{
    font-family:var(--mono);
    font-size:9.5px;
    letter-spacing:0.6px;
    fill:var(--navy);
    font-weight:700;
    text-transform:uppercase;
  }
  @media (prefers-reduced-motion: reduce){
    .journey-road{animation:none;}
  }

  /* ===== Service carousel (welcome hero) ===== */
  .service-carousel{
    display:flex;
    align-items:stretch;
    gap:12px;
    margin-bottom:32px;
    max-width:620px;
  }
  .carousel-arrow{
    flex:0 0 auto;
    width:34px;height:34px;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--navy);
    font-size:15px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    align-self:center;
    transition:all 0.15s ease;
    padding:0;
  }
  .carousel-arrow:hover{border-color:var(--gold);background:rgba(184,134,43,0.08);}
  .carousel-viewport{
    flex:1;
    overflow:hidden;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:#fff;
    position:relative;
    min-height:92px;
  }
  .carousel-card{
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:14px;
    animation:cardFade 0.35s ease;
  }
  @keyframes cardFade{
    from{opacity:0; transform:translateX(8px);}
    to{opacity:1; transform:translateX(0);}
  }
  .carousel-number{
    font-family:var(--mono);
    font-size:11px;
    color:var(--gold);
    border:1.5px solid var(--gold);
    border-radius:50%;
    width:30px;height:30px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .carousel-copy .carousel-title{
    font-family:var(--display);
    font-size:16px;
    font-weight:600;
    color:var(--navy);
    margin-bottom:3px;
  }
  .carousel-copy .carousel-desc{
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.4;
  }
  .carousel-dots{display:flex;gap:6px;justify-content:center;margin-top:10px;max-width:620px;}
  .carousel-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--line);
    border:none;padding:0;cursor:pointer;
    transition:all 0.2s ease;
  }
  .carousel-dot.active{background:var(--gold);width:18px;border-radius:3px;}

  /* ===== Review ===== */
  .review-block{margin-bottom:26px;}
  .review-block h3{
    font-family:var(--mono);
    font-size:11.5px;
    letter-spacing:1.2px;
    text-transform:uppercase;
    color:var(--gold);
    border-bottom:1px solid var(--line);
    padding-bottom:8px;
    margin-bottom:12px;
  }
  .review-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 24px;
  }
  @media (max-width:560px){.review-grid{grid-template-columns:1fr;}}
  .review-item dt{
    font-size:11px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.4px;
    font-family:var(--mono);
  }
  .review-item dd{
    margin:2px 0 0;
    font-size:14px;
    color:var(--ink);
  }
  .review-item dd:empty::after{content:"—";color:var(--ink-soft);}

  .seal{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:var(--teal);
    color:#fff;
    padding:10px 18px;
    border-radius:6px;
    font-family:var(--mono);
    font-size:12.5px;
    letter-spacing:0.5px;
    margin-bottom:24px;
  }
  .seal.error{background:var(--burgundy);}
  .seal.pending{background:var(--ink-soft);}

  .download-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }

  /* Print styles: only the printable summary shows */
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{
      display:block;
      position:absolute;
      left:0;top:0;
      width:100%;
      padding:20px;
    }
  }
</style>
</head>
<body>

<div class="coverbar">
  <div class="brand">
    <img class="crest-img" src="https://moresuccessacademy.com.ng/assets/images/logo.jpg" alt="More Success Academy logo">
    <div class="brand-text">
      <div class="name">More Success Academy</div>
      <div class="motto">Achieving Educational &amp; Career Milestones</div>
    </div>
  </div>
  <div class="doc-no">
    GLOBAL ADMISSIONS &amp; SCHOLARSHIP<br>MENTORSHIP INTAKE
  </div>
</div>

<div class="shell">
  <div id="progressShell"></div>
  <div class="trust-bar">
    <span class="trust-item"><span class="check">✓</span> Mentor-guided admissions support</span>
    <span class="trust-item"><span class="check">✓</span> Scholarship guidance</span>
    <span class="trust-item"><span class="check">✓</span> Visa preparation</span>
    <span class="trust-item"><span class="check">✓</span> Career mentorship</span>
  </div>
  <div class="layout">
    <div class="rail" id="rail"></div>
    <div class="paper" id="paper"></div>
  </div>
</div>

<!-- Hidden printable summary, populated on demand -->
<div id="printArea"></div>

<script>
(function(){

  // TODO: replace with your real Formspree endpoint (or Zoho Flow webhook URL)
  // Create one free at https://formspree.io — sign up, "New Form", copy the
  // endpoint that looks like https://formspree.io/f/xxxxxxxx and paste it below.

  function buildYearsDatalist(){
    // Runs off the browser's own clock, so it keeps extending into the
    // future automatically — no hardcoded end date to go stale.
    var dl = el('datalist', {id:'years-list'});
    var currentYear = new Date().getFullYear();
    for(var y = currentYear + 10; y >= 1960; y--){
      dl.appendChild(el('option', {value:String(y)}));
    }
    return dl;
  }

  function el(tag, attrs, children){
    var e = document.createElement(tag);
    if(attrs) for(var k in attrs){
      if(k === 'class') e.className = attrs[k];
      else if(k === 'html') e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(function(c){ if(c) e.appendChild(c); });
    return e;
  }

  function field(labelText, inputEl, hint){
    var wrap = el('div', {class:'field'});
    var lab = el('label', {}, [document.createTextNode(labelText)]);
    if(hint) lab.appendChild(el('span', {class:'hint'}, [document.createTextNode(hint)]));
    wrap.appendChild(lab);
    wrap.appendChild(inputEl);
    return wrap;
  }

  function textInput(type, key, placeholder, listId){
    var attrs = {type:type, placeholder:placeholder||''};
    if(listId) attrs.list = listId;
    var i = el('input', attrs);
    i.value = state[key] || '';
    i.addEventListener('input', function(){ state[key] = i.value; scheduleAutosave(); });
    return i;
  }

  function textarea(key, placeholder, rows){
    var t = el('textarea', {placeholder:placeholder||'', rows: rows||3});
    t.value = state[key] || '';
    t.addEventListener('input', function(){ state[key] = t.value; scheduleAutosave(); });
    return t;
  }

  function selectInput(key, options){
    var s = el('select', {});
    s.appendChild(el('option', {value:''}, [document.createTextNode('Select…')]));
    options.forEach(function(opt){
      var o = el('option', {value:opt}, [document.createTextNode(opt)]);
      if(state[key] === opt) o.setAttribute('selected','selected');
      s.appendChild(o);
    });
    s.addEventListener('change', function(){ state[key] = s.value; render(); notifySaved(); });
    return s;
  }

  function choiceGroup(key, options, multi){
    var wrap = el('div', {class:'choice-grid'});
    options.forEach(function(opt){
      var isPicked = multi ? state[key].indexOf(opt) > -1 : state[key] === opt;
      var input = el('input', {type: multi ? 'checkbox' : 'radio', name:key});
      input.checked = isPicked;
      var label = el('label', {class:'choice' + (isPicked ? ' picked' : '')}, [input, document.createTextNode(opt)]);
      label.addEventListener('click', function(e){
        e.preventDefault();
        if(multi){
          var arr = state[key];
          var idx = arr.indexOf(opt);
          if(idx > -1) arr.splice(idx,1); else arr.push(opt);
        } else {
          state[key] = opt;
        }
        render();
        notifySaved();
      });
      wrap.appendChild(label);
    });
    return wrap;
  }

  function buildJourneyMap(){
    var wrap = el('div', {class:'journey-map'});
    var svg = svgEl('svg', {viewBox:'0 0 600 120', class:'journey-svg', role:'img', 'aria-label':'Illustration of the journey from starting school to graduating abroad'});

    var roadPath = 'M54,78 C150,20 210,110 300,66 C380,30 430,92 546,40';

    // dashed road
    svg.appendChild(svgEl('path', {
      d: roadPath, fill:'none', stroke:'var(--gold)', 'stroke-width':'2.5',
      'stroke-linecap':'round', class:'journey-road'
    }));

    // three waypoint stamps along the road
    [ {cx:190, cy:47, n:'1'}, {cx:300, cy:66, n:'2'}, {cx:420, cy:52, n:'3'} ].forEach(function(pt){
      var g = svgEl('g', {});
      g.appendChild(svgEl('circle', {cx:pt.cx, cy:pt.cy, r:9, fill:'#FFFDF8', stroke:'var(--gold)', 'stroke-width':'1.5'}));
      var t = svgEl('text', {x:pt.cx, y:pt.cy+3.5, 'text-anchor':'middle', class:'journey-label', style:'font-weight:700;fill:var(--burgundy);'});
      t.textContent = pt.n;
      g.appendChild(t);
      svg.appendChild(g);
    });

    // building icon (start — where the journey begins)
    var building = svgEl('g', {transform:'translate(24,52)'});
    building.appendChild(svgEl('rect', {x:0,y:0,width:32,height:28,fill:'var(--navy)',rx:'1.5'}));
    building.appendChild(svgEl('polygon', {points:'-3,0 35,0 16,-13', fill:'var(--navy)'}));
    [4,13,22].forEach(function(x){
      building.appendChild(svgEl('rect', {x:x, y:7, width:6, height:6, fill:'var(--gold-light)'}));
    });
    building.appendChild(svgEl('rect', {x:13, y:17, width:6, height:11, fill:'var(--gold-light)'}));
    svg.appendChild(building);
    var startLabel = svgEl('text', {x:40, y:100, class:'journey-endpoint-label', 'text-anchor':'middle'});
    startLabel.textContent = 'You, today';
    svg.appendChild(startLabel);

    // graduation cap icon (end — where the journey leads)
    var cap = svgEl('g', {transform:'translate(524,16)'});
    cap.appendChild(svgEl('polygon', {points:'12,0 24,6 12,12 0,6', fill:'var(--navy)'}));
    cap.appendChild(svgEl('rect', {x:8, y:6, width:8, height:6, fill:'var(--navy)'}));
    cap.appendChild(svgEl('line', {x1:22, y1:6, x2:22, y2:16, stroke:'var(--navy)', 'stroke-width':'1.2'}));
    cap.appendChild(svgEl('circle', {cx:22, cy:17, r:1.8, fill:'var(--gold)'}));
    svg.appendChild(cap);
    var endLabel = svgEl('text', {x:536, y:44, class:'journey-endpoint-label', 'text-anchor':'middle'});
    endLabel.textContent = 'Graduate abroad';
    svg.appendChild(endLabel);

    // a small traveller dot animating along the same road
    var traveller = svgEl('circle', {r:4, fill:'var(--burgundy)'});
    var motion = svgEl('animateMotion', {dur:'7s', repeatCount:'indefinite', path: roadPath, rotate:'0'});
    traveller.appendChild(motion);
    svg.appendChild(traveller);

    wrap.appendChild(svg);
    return wrap;
  }

  var carouselIndex = 0;

  function stopCarouselAutoplay(){

  }

  function buildServiceCarousel(){
    var wrap = el('div', {});
    var row = el('div', {class:'service-carousel'});
    var prev = el('button', {class:'carousel-arrow', type:'button', 'aria-label':'Previous service'}, [document.createTextNode('‹')]);
    var viewport = el('div', {class:'carousel-viewport'});
    var next = el('button', {class:'carousel-arrow', type:'button', 'aria-label':'Next service'}, [document.createTextNode('›')]);
    var dots = el('div', {class:'carousel-dots'});

    function paint(){
      viewport.innerHTML = '';
      var svc = carouselServices[carouselIndex];
      var card = el('div', {class:'carousel-card'});
      card.appendChild(el('div', {class:'carousel-number'}, [document.createTextNode(String(carouselIndex+1).padStart(2,'0'))]));
      var copy = el('div', {class:'carousel-copy'});
      copy.appendChild(el('div', {class:'carousel-title'}, [document.createTextNode(svc.title)]));
      copy.appendChild(el('div', {class:'carousel-desc'}, [document.createTextNode(svc.desc)]));
      card.appendChild(copy);
      viewport.appendChild(card);

      dots.innerHTML = '';
      carouselServices.forEach(function(_, i){
        var d = el('button', {class:'carousel-dot' + (i === carouselIndex ? ' active' : ''), type:'button', 'aria-label':'Go to service ' + (i+1)});
        d.addEventListener('click', function(){ carouselIndex = i; paint(); restartAutoplay(); });
        dots.appendChild(d);
      });
    }

    function step(delta){
      carouselIndex = (carouselIndex + delta + carouselServices.length) % carouselServices.length;
      paint();
    }

    function restartAutoplay(){
      stopCarouselAutoplay();
      carouselTimer = setInterval(function(){ step(1); }, 3200);
    }

    prev.addEventListener('click', function(){ step(-1); restartAutoplay(); });
    next.addEventListener('click', function(){ step(1); restartAutoplay(); });
    row.addEventListener('mouseenter', stopCarouselAutoplay);
    row.addEventListener('mouseleave', restartAutoplay);

    // basic swipe support
    var touchStartX = null;
    viewport.addEventListener('touchstart', function(e){ touchStartX = e.touches[0].clientX; }, {passive:true});
    viewport.addEventListener('touchend', function(e){
      if(touchStartX === null) return;
      var dx = e.changedTouches[0].clientX - touchStartX;
      if(Math.abs(dx) > 30){ step(dx < 0 ? 1 : -1); restartAutoplay(); }
      touchStartX = null;
    }, {passive:true});

    row.appendChild(prev);
    row.appendChild(viewport);
    row.appendChild(next);
    wrap.appendChild(row);
    wrap.appendChild(dots);

    paint();
    restartAutoplay();
    return wrap;
  }

      var blocks = [
        {title:'Personal Information', items:[
          ['Full Name', state.fullName],['Date of Birth', state.dob],['Email', state.email],
          ['Phone', state.phone],['Country', state.country],['City', state.city],['Address', state.address]
        ]},
        {title:'Academic Profile', items:[
          ['Highest Qualification', state.highestQual],['Institution', state.institution],
          ['Field of Study', state.fieldOfStudy],['CGPA / Class', state.gradeClass],['Graduation Year', state.gradYear]
        ]},
        {title:'Career Goals', items:[
          ['Target Career', state.targetCareer],['Short-Term Goal', state.shortGoal],['Long-Term Goal', state.longGoal]
        ]},
        {title:'Country Preferences', items:[
          ['Countries', state.countries.join(', ')],['Canada — PGWP priority', state.canadaPGWP],
          ['UK — Graduate Route', state.ukGradRoute],['USA — GRE/GMAT', state.usaTest]
        ]},
        {title:'Financial Capacity', items:[
          ['Annual Budget', state.budget],['Funding Source', state.fundingSource],['Guarantor', state.guarantor]
        ]},
        {title:'Scholarships', items:[
          ['Seeking Scholarships', state.seekingScholarship],['Types of Interest', state.scholarshipTypes.join(', ')],
          ['Already Applied For', state.scholarshipApplied]
        ]},
        {title:'Work Experience', items:[
          ['Years of Experience', state.yearsExp],['Current Role', state.currentRole],['Achievements', state.achievements]
        ]},
        {title:'Documents', items:[
          ['Transcript', state.fileTranscript],['CV', state.fileCV],['Passport Bio Page', state.filePassport],['Passport Photo', state.filePhoto]
        ]},
        {title:'Consent', items:[
          ['Accuracy Confirmed', state.consentAccuracy ? 'Yes' : 'No'],
          ['Communication Consent', state.consentComms ? 'Yes' : 'No'],
          ['Signature', state.signature]
        ]}
      ];

      blocks.forEach(function(b){
        var block = el('div', {class:'review-block'});
        block.appendChild(el('h3', {}, [document.createTextNode(b.title)]));
        var grid = el('div', {class:'review-grid'});
        b.items.forEach(function(pair){
          var item = el('div', {class:'review-item'});
          item.appendChild(el('dt', {}, [document.createTextNode(pair[0])]));
          item.appendChild(el('dd', {}, [document.createTextNode(pair[1] || '')]));
          grid.appendChild(item);
        });
        block.appendChild(grid);
        container.appendChild(block);
      });

      var dlRow = el('div', {class:'download-row'});

      var submitBtn = el('button', {class:'btn-gold'}, [document.createTextNode(
        submitStatus === 'sent' ? '✓ Submitted' : (submitStatus === 'sending' ? 'Submitting…' : 'Submit Application to Mentor')
      )]);
      if(submitStatus === 'sending' || submitStatus === 'sent') submitBtn.disabled = true;
      submitBtn.addEventListener('click', submitApplication);
      dlRow.appendChild(submitBtn);

      var pdfBtn = el('button', {class:'btn-ghost'}, [document.createTextNode('⬇ Download as PDF')]);
      pdfBtn.addEventListener('click', downloadPDF);
      var txtBtn = el('button', {class:'btn-ghost'}, [document.createTextNode('⬇ Download as Text File')]);
      txtBtn.addEventListener('click', downloadText);
      dlRow.appendChild(pdfBtn);
      dlRow.appendChild(txtBtn);
      container.appendChild(dlRow);

      var backRow = el('div', {class:'nav-row'});
      var back = el('button', {class:'btn-ghost'}, [document.createTextNode('← Edit Answers')]);
      back.addEventListener('click', function(){ goTo(currentIndex - 1); });
      backRow.appendChild(back);
      backRow.appendChild(el('span'));
      container.appendChild(backRow);

      buildPrintArea(blocks);
    }
  };

  function submitApplication(){
    if(SUBMIT_ENDPOINT.indexOf('REPLACE_WITH_YOUR_FORM_ID') > -1){
      alert('Submission is not wired up yet: paste your real Formspree (or Zoho Flow) endpoint into SUBMIT_ENDPOINT near the top of the script before going live.');
      return;
    }
    submitStatus = 'sending';
    render();

    var payload = {
      fullName: state.fullName, dob: state.dob, email: state.email, phone: state.phone,
      country: state.country, city: state.city, address: state.address,
      highestQual: state.highestQual, institution: state.institution, fieldOfStudy: state.fieldOfStudy,
      gradeClass: state.gradeClass, gradYear: state.gradYear,
      targetCareer: state.targetCareer, shortGoal: state.shortGoal, longGoal: state.longGoal,
      countries: state.countries.join(', '), canadaPGWP: state.canadaPGWP, ukGradRoute: state.ukGradRoute, usaTest: state.usaTest,
      budget: state.budget, fundingSource: state.fundingSource, guarantor: state.guarantor,
      seekingScholarship: state.seekingScholarship, scholarshipTypes: state.scholarshipTypes.join(', '), scholarshipApplied: state.scholarshipApplied,
      yearsExp: state.yearsExp, currentRole: state.currentRole, achievements: state.achievements,
      fileTranscript: state.fileTranscript, fileCV: state.fileCV, filePassport: state.filePassport, filePhoto: state.filePhoto,
      consentAccuracy: state.consentAccuracy ? 'Yes' : 'No', consentComms: state.consentComms ? 'Yes' : 'No', signature: state.signature,
      _subject: 'New MSA Mentorship Application — ' + (state.fullName || 'Unnamed applicant')
    };

    fetch(SUBMIT_ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify(payload)
    }).then(function(res){
      submitStatus = res.ok ? 'sent' : 'error';
      render();
    }).catch(function(){
      submitStatus = 'error';
      render();
    });
  }

  function buildPrintArea(blocks){
    var area = document.getElementById('printArea');
    area.innerHTML = '';
    var header = document.createElement('div');
    header.style.borderBottom = '3px solid #D4AF37';
    header.style.paddingBottom = '14px';
    header.style.marginBottom = '18px';
    header.innerHTML = '<div style="font-family:Fraunces,serif;font-size:22px;font-weight:600;color:#050B2E;">More Success Academy</div>' +
      '<div style="font-family:monospace;font-size:11px;letter-spacing:1px;color:#D4AF37;text-transform:uppercase;">Global Admissions &amp; Scholarship Mentorship — Intake Summary</div>' +
      '<div style="font-family:monospace;font-size:10px;color:#666;margin-top:4px;">Generated: ' + new Date().toLocaleDateString() + '</div>';
    area.appendChild(header);
    blocks.forEach(function(b){
      var h = document.createElement('h3');
      h.style.fontFamily = 'monospace';
      h.style.fontSize = '11px';
      h.style.letterSpacing = '1px';
      h.style.textTransform = 'uppercase';
      h.style.color = '#D4AF37';
      h.style.borderBottom = '1px solid #DCD4C2';
      h.style.paddingBottom = '6px';
      h.style.marginTop = '18px';
      h.textContent = b.title;
      area.appendChild(h);
      b.items.forEach(function(pair){
        var row = document.createElement('div');
        row.style.fontSize = '12.5px';
        row.style.margin = '4px 0';
        row.innerHTML = '<strong>' + pair[0] + ':</strong> ' + (pair[1] || '—');
        area.appendChild(row);
      });
    });
  }

  function downloadPDF(){
    window.print();
  }

  function downloadText(){
    var lines = ['MORE SUCCESS ACADEMY — GLOBAL ADMISSIONS & SCHOLARSHIP MENTORSHIP', 'Intake Summary — Generated ' + new Date().toLocaleString(), ''];
    var area = document.getElementById('printArea');
    area.querySelectorAll('h3, div').forEach(function(node){
      if(node.tagName === 'H3') lines.push('\n' + node.textContent.toUpperCase());
      else lines.push(node.textContent);
    });
    var blob = new Blob([lines.join('\n')], {type:'text/plain'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    var safeName = (state.fullName || 'applicant').replace(/[^a-z0-9]/gi,'_');
    a.download = 'MSA_Intake_' + safeName + '.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function renderRail(){
    var rail = document.getElementById('rail');
    rail.innerHTML = '';
    rail.appendChild(el('div', {class:'rail-title'}, [document.createTextNode('APPLICATION STAGES')]));
    stageDefs.forEach(function(s, idx){
      if(idx === 0) return; // skip welcome in rail
      var status = idx === currentIndex ? 'active' : (idx < currentIndex || idx <= maxReached ? 'done' : '');
      if(idx === currentIndex) status = 'active';
      var stage = el('div', {class:'stage ' + status + (idx <= maxReached ? ' clickable' : '')});
      var num = idx < currentIndex ? '✓' : String(idx).padStart(2,'0');
      var markerCol = el('div', {class:'marker-col'});
      markerCol.appendChild(el('div', {class:'stamp'}, [document.createTextNode(num)]));
      var isLast = idx === stageDefs.length - 1;
      if(!isLast){
        markerCol.appendChild(el('div', {class:'connector' + (idx < currentIndex ? ' filled' : '')}));
      }
      stage.appendChild(markerCol);
      stage.appendChild(el('div', {class:'stage-label'}, [document.createTextNode(s.label)]));
      if(idx <= maxReached){
        stage.addEventListener('click', function(){ goTo(idx); });
      }
      rail.appendChild(stage);
    });
  }

  function renderProgressBar(){
    var mount = document.getElementById('progressShell');
    mount.innerHTML = '';
    var totalSteps = stageDefs.length - 1; // exclude welcome
    var stepNum = currentIndex; // 0 on welcome
    var percent = Math.round((stepNum / totalSteps) * 100);
    var shell = el('div', {class:'progress-shell'});
    var top = el('div', {class:'progress-toprow'});
    top.appendChild(el('div', {class:'ptitle'}, [document.createTextNode('Application Progress')]));
    var statText = currentIndex === 0 ? 'Not started' : ('Step ' + stepNum + ' of ' + totalSteps + ' · ' + percent + '% complete');
    top.appendChild(el('div', {class:'pstat'}, [document.createTextNode(statText)]));
    shell.appendChild(top);
    var track = el('div', {class:'progress-track'});
    track.appendChild(el('div', {class:'progress-fill', style:'width:' + percent + '%'}));
    shell.appendChild(track);
    mount.appendChild(shell);
  }

  var autosaveTimer = null;
  var autosaveToastEl = null;
  var autosaveDebounce = null;
  function notifySaved(){
    if(currentIndex === 0) return; // nothing to save on the welcome screen
    if(!autosaveToastEl){
      autosaveToastEl = el('div', {class:'autosave-toast'}, [document.createTextNode('Saved just now')]);
      document.body.appendChild(autosaveToastEl);
    }
    autosaveToastEl.classList.add('show');
    if(autosaveTimer) clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(function(){ autosaveToastEl.classList.remove('show'); }, 1500);
  }
  function scheduleAutosave(){
    if(autosaveDebounce) clearTimeout(autosaveDebounce);
    autosaveDebounce = setTimeout(notifySaved, 700);
  }

  function render(){
    var paper = document.getElementById('paper');
    paper.innerHTML = '';
    var stepWrap = el('div', {class:'step-enter'});
    var key = stageDefs[currentIndex].key;
    renderers[key](stepWrap);
    paper.appendChild(stepWrap);
    renderRail();
    renderProgressBar();
  }

  function goTo(idx){
    if(idx < 0) idx = 0;
    if(idx > stageDefs.length - 1) idx = stageDefs.length - 1;
    if(idx !== 0) stopCarouselAutoplay();
    currentIndex = idx;
    if(idx > maxReached) maxReached = idx;
    render();
    window.scrollTo(0,0);
  }

  document.body.appendChild(buildInstitutionsDatalist());
  document.body.appendChild(buildYearsDatalist());
  render();
})();
</script>

</body>
</html>
