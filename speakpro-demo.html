<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speak Pro — Business Communication Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{
    --navy:#050B2E; --navy-deep:#03071A; --gold:#D4AF37; --gold-light:#E6C666;
    --teal:#2E8368; --cream:#F1EFEA; --ink-soft:#A9AEC4;
    --panel:rgba(255,255,255,0.05); --line:rgba(255,255,255,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#e5e5e5;font-family:'DM Sans',sans-serif;}
  .stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 12px;}
  .phone{
    width:100%;max-width:380px;height:760px;background:var(--navy);
    border-radius:2.25rem;border:8px solid var(--navy-deep);
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
    display:flex;flex-direction:column;overflow:hidden;position:relative;
  }
  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 4px;color:var(--cream);font-size:12px;font-weight:600;}
  .statusbar i{font-size:12px;margin-left:6px;}
  .topheader{display:flex;align-items:center;gap:10px;padding:8px 20px 16px;border-bottom:1px solid var(--line);min-height:20px;}
  .topheader h1{font-family:'Syne',sans-serif;font-weight:700;font-size:16px;color:var(--cream);margin:0;flex:1;}
  .topheader button{background:none;border:none;color:var(--cream);font-size:20px;cursor:pointer;padding:2px;}
  .screen{flex:1;overflow-y:auto;padding:0 20px 24px;}
  .navbar{display:flex;border-top:1px solid var(--line);background:var(--navy-deep);}
  .navbtn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;cursor:pointer;color:var(--ink-soft);font-family:'DM Sans',sans-serif;}
  .navbtn i{font-size:17px;}
  .navbtn span{font-size:9.5px;font-weight:500;}
  .navbtn.active{color:var(--gold);}
  .navbtn.active span{font-weight:700;}
  .homebar{display:flex;justify-content:center;padding:6px 0 8px;background:var(--navy-deep);}
  .homebar div{width:110px;height:4px;border-radius:4px;background:rgba(255,255,255,0.25);}

  h2.title{font-family:'Syne',sans-serif;font-weight:700;color:var(--cream);font-size:19px;margin:4px 0 4px;}
  p.sub{color:var(--ink-soft);font-size:12.5px;margin:0 0 18px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
  .badge{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:12px;}
  .badge-gold{background:rgba(212,175,55,0.14);color:var(--gold-light);border:1px solid rgba(212,175,55,0.4);}
  .badge-teal{background:rgba(46,131,104,0.18);color:#8fe0c4;border:1px solid rgba(46,131,104,0.5);}
  .badge-grey{background:rgba(255,255,255,0.06);color:var(--ink-soft);border:1px solid var(--line);}
  .badge-locked{background:rgba(255,255,255,0.03);color:#6b7080;border:1px solid var(--line);}
  .btn-gold{background:var(--gold);color:var(--navy-deep);border:none;font-weight:700;font-family:'DM Sans',sans-serif;padding:13px 20px;border-radius:8px;width:100%;cursor:pointer;font-size:14px;}
  .btn-ghost{background:transparent;color:var(--cream);border:1.5px solid var(--line);font-weight:600;font-family:'DM Sans',sans-serif;padding:12px 20px;border-radius:8px;cursor:pointer;font-size:14px;width:100%;}

  .logo-circle{width:56px;height:56px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px rgba(212,175,55,0.5);margin-bottom:14px;}
  .streak-row{display:flex;gap:10px;margin-bottom:16px;}
  .streak-box{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;}
  .streak-box .num{font-family:'Syne',sans-serif;font-weight:700;color:var(--gold);font-size:20px;}
  .streak-box .lbl{color:var(--ink-soft);font-size:10px;margin-top:2px;}

  /* Scenario list */
  .scen-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:12px;}
  .scen-card.locked{opacity:0.55;cursor:default;}
  .scen-icon{width:38px;height:38px;border-radius:10px;background:rgba(212,175,55,0.1);border:1px solid rgba(212,175,55,0.25);display:flex;align-items:center;justify-content:center;color:var(--gold-light);font-size:16px;flex-shrink:0;}
  .scen-card .t{color:var(--cream);font-size:13.5px;font-weight:600;margin:0 0 2px;}
  .scen-card .s{color:var(--ink-soft);font-size:11px;margin:0;}

  /* Trainer */
  .step-track{display:flex;gap:6px;margin-bottom:16px;}
  .step-track div{flex:1;height:4px;border-radius:4px;background:var(--line);}
  .step-track div.done{background:var(--gold);}
  .client-line{background:rgba(27,79,216,0.1);border:1px solid rgba(27,79,216,0.25);border-radius:12px;padding:13px 15px;margin-bottom:14px;}
  .client-line .who{font-size:10.5px;color:#7eb3ff;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;}
  .client-line p{margin:0;color:var(--cream);font-size:13.5px;font-style:italic;line-height:1.5;}
  .context-box{background:rgba(212,175,55,0.07);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:12px 14px;margin-bottom:14px;}
  .context-box .lbl{font-size:10px;color:var(--gold-light);text-transform:uppercase;letter-spacing:0.8px;font-weight:700;margin-bottom:5px;}
  .context-box p{margin:0;color:var(--cream);font-size:12.5px;line-height:1.55;}
  .mic-wrap{display:flex;justify-content:center;margin:14px 0 8px;}
  .mic-circle{width:60px;height:60px;border-radius:50%;border:2.5px solid rgba(212,175,55,0.4);background:rgba(212,175,55,0.08);color:var(--gold);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;}
  .mic-circle.recording{background:#ff3b3b;border-color:#ff3b3b;color:#fff;animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  .mic-status{text-align:center;color:var(--ink-soft);font-size:11.5px;min-height:15px;margin-bottom:8px;}
  textarea.demo-ta{width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--cream);font-family:'DM Sans',sans-serif;font-size:13.5px;resize:vertical;min-height:70px;margin-bottom:12px;}
  textarea.demo-ta:focus{outline:none;border-color:var(--gold);}

  .checklist-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
  .checklist-item:last-child{border-bottom:none;}
  .checklist-item i{margin-top:2px;font-size:13px;flex-shrink:0;}
  .checklist-item.pass i{color:#8fe0c4;}
  .checklist-item.fail i{color:#ff9d9d;}
  .checklist-item span{font-size:12.5px;color:var(--cream);line-height:1.4;}
  .model-answer{background:rgba(46,131,104,0.1);border:1px solid rgba(46,131,104,0.3);border-radius:10px;padding:12px 14px;margin-top:14px;}
  .model-answer .lbl{font-size:10px;color:#8fe0c4;text-transform:uppercase;letter-spacing:0.8px;font-weight:700;margin-bottom:5px;}
  .model-answer p{margin:0;color:var(--cream);font-size:12.5px;font-style:italic;line-height:1.55;}

  .summary-ring{width:88px;height:88px;border-radius:50%;border:5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;font-size:22px;color:var(--gold);margin:10px auto 18px;}
</style>
</head>

<div class="stage">
  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <span><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
    </div>
    <div class="topheader" id="topheader"></div>
    <div class="screen" id="screen"></div>
    <div class="navbar" id="navbar"></div>
    <div class="homebar"><div></div></div>
  </div>
</div>

        {
          key: 'explain', label: 'Explain the Diagnosis',
          context: "Your inspection shows: this is a foundation settlement crack, not just surface plaster cracking. It needs foundation reinforcement — simply filling and painting over it will only hide the problem, and it will reopen or worsen over time.",
          prompt: "Explain this clearly so the client understands it's more serious than it looks, without causing panic.",
          checklist: [
            { label: 'Named the real issue (foundation / settlement)', re: /\b(foundation|settl(e|ing|ement))\b/i },
            { label: 'Explained why it\'s serious (structural, not just surface)', re: /\b(structur|serious|deep|more than|not just)\b/i },
            { label: 'Mentioned what happens if just patched (reopens/worsens)', re: /\b(reopen|worse|come back|return|crack again)\b/i },
            { label: 'Gave enough detail (not just "wall get crack")', minWords: 10 }
          ],
          model: "Looking at this closely, this isn't just a surface crack in the plaster — the pattern shows it's coming from the foundation settling underneath. If we just fill and paint over it, it will crack open again, maybe worse, because we haven't dealt with the actual movement underneath."
        },
        {
          key: 'price', label: 'Justify the Price',
          context: "Total cost: ₦180,000 — reinforcement materials ₦120,000, labor ₦60,000.",
          prompt: "Explain this cost so the client sees why a wall crack costs this much to fix properly.",
          checklist: [
            { label: 'Broke the cost into materials and labor', needsBoth: [/\bmaterials?\b/i, /\blabou?r\b/i] },
            { label: 'Explained the value (proper/lasting fix vs. temporary patch)', re: /\b(proper|last|lasting|permanent|guarantee|structural)\b/i },
            { label: 'Stated a clear total price', re: /(₦|\bn)\s?180[,.]?000|180k/i }
          ],
          model: "This is ₦180,000 in total — ₦120,000 for the reinforcement materials, and ₦60,000 for labor. This is more than a paint-and-fill job because we're actually addressing the foundation movement, so it doesn't come back in six months as a bigger, more expensive problem."
        },
        {
          key: 'defend', label: 'Defend Under Pushback',
          context: "Client responds: \"That's too much. My friend fit patch am with cement for ₦30,000.\"",
          prompt: "Respond firmly but respectfully — this is a case where cutting corners is genuinely risky.",
          checklist: [
            { label: "Acknowledged the client's concern about cost", re: /\b(i understand|i hear you|i get (that|you)|i know|makes? sense)\b/i },
            { label: 'Reasserted the structural risk of patching only', re: /\b(structur|foundation|reopen|worse|risk|safety)\b/i },
            { label: 'Did not simply match the lower price', fail_re: /(₦|\bn)?\s?30[,.]?000|30k/i }
          ],
          model: "I understand ₦180,000 sounds like a lot compared to ₦30,000 for cement patching — but that patch won't hold, because it doesn't fix the foundation movement causing the crack. If it worsens later, you could be looking at real structural repairs costing far more than either quote right now. I'd rather you know that clearly before deciding."
        }
      ]
    },
    { id: 'quote', available: false, icon: 'fa-file-invoice-dollar', title: 'Quoting a Big Job', client: 'Coming soon' },
    { id: 'complaint', available: false, icon: 'fa-triangle-exclamation', title: 'Handling a Complaint', client: 'Coming soon' },
    { id: 'register', available: false, icon: 'fa-people-arrows', title: 'Reading Your Client', client: 'Coming soon — adapting to a more formal caller' }
  ];

  var state = { screen: 'home', scenarioId: null, stepIndex: 0, stepResults: [] };
  var recognizing = false, recognition = null;
  var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

  function esc(s){ var d=document.createElement('div'); d.innerText = s||''; return d.innerHTML; }
  function currentScenario(){ return scenarios.filter(function(s){return s.id===state.scenarioId;})[0]; }

  // ===== SCREENS =====
  var screens = {

    home: function(){
      return '<div style="text-align:center;padding-top:8px;">' +
        '<img src="'+LOGO_SRC+'" class="logo-circle" style="margin-left:auto;margin-right:auto;">' +
        '<p style="color:var(--gold);font-size:11px;letter-spacing:2px;text-transform:uppercase;font-family:\'DM Sans\',sans-serif;margin-bottom:8px;">Speak Pro by MSA</p>' +
        '<h1 style="font-family:\'Syne\',sans-serif;font-weight:700;color:var(--cream);font-size:20px;line-height:1.3;margin:0 0 10px;">Learn to explain your work, price it with confidence, and hold your ground.</h1>' +
        '</div>' +
        '<div class="streak-row">' +
          '<div class="streak-box"><div class="num">4</div><div class="lbl">Scenarios Live</div></div>' +
          '<div class="streak-box"><div class="num">3</div><div class="lbl">Skills / Scenario</div></div>' +
          '<div class="streak-box"><div class="num">3</div><div class="lbl">Coming Soon</div></div>' +
        '</div>' +
        '<button class="btn-gold" onclick="SPEAKPRO.goTo(\'scenarios\')"><i class="fas fa-comments" style="margin-right:8px;"></i>Start Training</button>' +
        '<p style="color:var(--ink-soft);font-size:11px;letter-spacing:1px;text-transform:uppercase;font-family:\'DM Sans\',sans-serif;margin:22px 0 10px;">This trains the real skill</p>' +
        '<div class="card">' +
          '<p style="color:var(--cream);font-size:13px;margin:0 0 8px;font-weight:600;">Not grammar. Business communication.</p>' +
          '<p style="color:var(--ink-soft);font-size:12px;margin:0;line-height:1.6;">A mechanic can be brilliant with cars and still lose the job — because he can\'t explain the problem, justify the price, or hold his ground when a client pushes back. Speak Pro trains that, step by step, using your real trade situations.</p>' +
        '</div>';
    },

    scenarios: function(){
      var html = '<h2 class="title" style="margin-top:4px;">Practice Scenarios</h2><p class="sub">Each one trains diagnose → explain → price → defend</p>';
      scenarios.forEach(function(s){
        if(s.available){
          html += '<div class="scen-card" onclick="SPEAKPRO.startScenario(\''+s.id+'\')">' +
            '<div class="scen-icon"><i class="fas '+s.icon+'"></i></div>' +
            '<div style="flex:1;"><p class="t">'+esc(s.title)+'</p><p class="s">"'+esc(s.client)+'"</p></div>' +
            '<i class="fas fa-chevron-right" style="color:var(--ink-soft);"></i></div>';
        } else {
          html += '<div class="scen-card locked">' +
            '<div class="scen-icon"><i class="fas fa-lock"></i></div>' +
            '<div style="flex:1;"><p class="t">'+esc(s.title)+'</p><p class="s">'+esc(s.client)+'</p></div>' +
            '</div>';
        }
      });
      return html;
    },

    trainer: function(){
      var sc = currentScenario();
      var step = sc.steps[state.stepIndex];
      var total = sc.steps.length;
      var tHtml = '<div class="step-track">';
      for(var i=0;i<total;i++){ tHtml += '<div class="'+(i<state.stepIndex ? 'done' : (i===state.stepIndex?'done':''))+'"></div>'; }
      tHtml += '</div>';

      var html = tHtml;
      html += '<p style="color:var(--gold);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;font-family:\'DM Sans\',sans-serif;margin-bottom:4px;">Step '+(state.stepIndex+1)+' of '+total+'</p>';
      html += '<h2 class="title">'+esc(step.label)+'</h2>';

      if(state.stepIndex === 0){
        html += '<div class="client-line"><p class="who">Client says</p><p>"'+esc(sc.client)+'"</p></div>';
      }
      html += '<div class="context-box"><p class="lbl">What you know</p><p>'+esc(step.context)+'</p></div>';
      html += '<p class="sub" style="margin-bottom:8px;">'+esc(step.prompt)+'</p>';

      html += '<div class="mic-wrap"><button class="mic-circle" id="micBtn"><i class="fas fa-microphone"></i></button></div>';
      html += '<p class="mic-status" id="micStatus"></p>';
      html += '<textarea class="demo-ta" id="demoTa" rows="4" placeholder="Speak or type your response here..."></textarea>';
      html += '<button class="btn-gold" id="submitBtn">Submit Response</button>';
      html += '<div id="feedbackBox" style="display:none;"></div>';
      html += '<p id="unsupportedNote" style="display:none;color:var(--ink-soft);font-size:11px;text-align:center;margin-top:10px;">Voice input isn\'t supported here — just type instead.</p>';
      return html;
    },

    summary: function(){
      var sc = currentScenario();
      var totalItems = 0, passedItems = 0;
      state.stepResults.forEach(function(r){ totalItems += r.length; passedItems += r.filter(function(x){return x.pass;}).length; });
      var pct = totalItems ? Math.round((passedItems/totalItems)*100) : 0;

      var html = '<h2 class="title" style="margin-top:4px;">Session Complete</h2><p class="sub">'+esc(sc.title)+'</p>';
      html += '<div class="summary-ring">'+pct+'%</div>';
      html += '<p style="text-align:center;color:var(--ink-soft);font-size:12.5px;margin-bottom:22px;">'+passedItems+' of '+totalItems+' coaching points covered across all 3 steps.</p>';

      sc.steps.forEach(function(step, i){
        html += '<div class="card"><p style="color:var(--cream);font-size:13px;font-weight:600;margin:0 0 6px;">'+esc(step.label)+'</p>';
        (state.stepResults[i] || []).forEach(function(r){
          html += '<div class="checklist-item '+(r.pass?'pass':'fail')+'"><i class="fas '+(r.pass?'fa-circle-check':'fa-circle-xmark')+'"></i><span>'+esc(r.label)+'</span></div>';
        });
        html += '</div>';
      });

      html += '<button class="btn-gold" onclick="SPEAKPRO.goTo(\'scenarios\')">Try Another Scenario</button>';
      html += '<button class="btn-ghost" style="margin-top:10px;" onclick="SPEAKPRO.retryScenario()">Retry This One</button>';
      return html;
    }
  };

  var titles = { scenarios:'Practice Scenarios', trainer:null, summary:null };
  var navItems = [
    ['home','fa-house','Home'], ['scenarios','fa-comments','Scenarios']
  ];

  function render(){
    document.getElementById('screen').innerHTML = screens[state.screen]();
    var th = document.getElementById('topheader');
    var isTrainerFlow = (state.screen === 'trainer' || state.screen === 'summary');
    if(isTrainerFlow){
      var sc = currentScenario();
      th.innerHTML = '<button onclick="SPEAKPRO.exitScenario()"><i class="fas fa-chevron-left"></i></button><h1>'+esc(sc.title)+'</h1>';
    } else {
      th.innerHTML = titles[state.screen] ? '<h1>'+titles[state.screen]+'</h1>' : '';
    }

    var nav = document.getElementById('navbar');
    nav.innerHTML = '';
    var activeTab = isTrainerFlow ? 'scenarios' : state.screen;
    navItems.forEach(function(item){
      var btn = document.createElement('button');
      btn.className = 'navbtn' + (activeTab===item[0] ? ' active' : '');
      btn.innerHTML = '<i class="fas '+item[1]+'"></i><span>'+item[2]+'</span>';
      btn.onclick = function(){ SPEAKPRO.goTo(item[0]); };
      nav.appendChild(btn);
    });

    if(state.screen === 'trainer'){ wireTrainerScreen(); }
  }

  function wireTrainerScreen(){
    var micBtn = document.getElementById('micBtn');
    var micStatus = document.getElementById('micStatus');
    var textarea = document.getElementById('demoTa');
    var unsupportedNote = document.getElementById('unsupportedNote');
    var submitBtn = document.getElementById('submitBtn');

    if(!SpeechRec){
      if(micBtn) micBtn.style.display = 'none';
      if(unsupportedNote) unsupportedNote.style.display = 'block';
    } else {
      try {
        recognition = new SpeechRec();
        recognition.lang = 'en-NG';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = function(){
          micStatus.textContent = 'Listening... tap the mic again to stop.';
        };
        recognition.onresult = function(e){
          var finalText = '', interimText = '';
          for(var i=0;i<e.results.length;i++){
            if(e.results[i].isFinal){ finalText += e.results[i][0].transcript + ' '; }
            else { interimText += e.results[i][0].transcript; }
          }
          textarea.value = (finalText + interimText).trim();
        };
        recognition.onerror = function(e){
          var msg = 'Mic issue: ' + e.error + '.';
          if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
            msg = 'Microphone access was blocked. Allow it in your browser\'s address-bar permissions, and make sure you\'re viewing this on the live, hosted page — not a local file or preview window. You can still type your answer above.';
          } else if(e.error === 'no-speech'){
            msg = 'Didn\'t catch that — try speaking again, a bit closer to the mic.';
          } else if(e.error === 'audio-capture'){
            msg = 'No microphone was found on this device. You can type your answer instead.';
          } else if(e.error === 'network'){
            msg = 'Network issue reaching the speech service — try again, or type your answer.';
          }
          micStatus.textContent = msg;
          recognizing = false;
          micBtn.classList.remove('recording');
        };
        recognition.onend = function(){
          if(recognizing){ recognizing = false; micBtn.classList.remove('recording'); }
        };

        micBtn.addEventListener('click', function(){
          if(!recognizing){
            micStatus.textContent = 'Requesting microphone access...';
            recognizing = true;
            micBtn.classList.add('recording');
            try {
              recognition.start();
            } catch(err){
              micStatus.textContent = 'Could not start the mic (' + err.message + '). Try tapping again, or type your answer.';
              recognizing = false;
              micBtn.classList.remove('recording');
            }
          } else {
            stopRecording(micBtn, micStatus);
          }
        });
      } catch(setupErr){
        micBtn.style.display = 'none';
        unsupportedNote.style.display = 'block';
        unsupportedNote.textContent = 'Voice input couldn\'t start in this browser. Just type your answer above instead.';
      }
    }

    submitBtn.addEventListener('click', function(){
      var text = textarea.value.trim();
      if(!text){ textarea.focus(); return; }
      if(recognizing) stopRecording(micBtn, micStatus);
      evaluateStep(text);
    });
  }

  function startRecording(micBtn, micStatus){
    recognizing = true; micBtn.classList.add('recording');
    micStatus.textContent = 'Listening... tap again to stop.';
    try{ recognition.start(); }catch(e){}
  }
  function stopRecording(micBtn, micStatus){
    recognizing = false; micBtn.classList.remove('recording');
    micStatus.textContent = '';
    try{ recognition.stop(); }catch(e){}
  }

  function evaluateStep(text){
    var sc = currentScenario();
    var step = sc.steps[state.stepIndex];
    var results = [];

    step.checklist.forEach(function(item){
      var pass;
      if(item.fail_re){
        pass = !item.fail_re.test(text);
      } else if(item.needsBoth){
        pass = item.needsBoth.every(function(re){ return re.test(text); });
      } else if(item.minWords){
        pass = text.trim().split(/\s+/).length >= item.minWords;
      } else {
        pass = item.re.test(text);
      }
      results.push({ label: item.label, pass: pass });
    });

    state.stepResults[state.stepIndex] = results;

    var passCount = results.filter(function(r){return r.pass;}).length;
    var html = '<div class="card" style="margin-top:16px;">';
    html += '<p style="color:var(--cream);font-size:13px;font-weight:600;margin:0 0 10px;">'+passCount+' of '+results.length+' covered</p>';
    results.forEach(function(r){
      html += '<div class="checklist-item '+(r.pass?'pass':'fail')+'"><i class="fas '+(r.pass?'fa-circle-check':'fa-circle-xmark')+'"></i><span>'+esc(r.label)+'</span></div>';
    });
    html += '<div class="model-answer"><p class="lbl">Strong example response</p><p>"'+esc(step.model)+'"</p></div>';
    html += '</div>';

    var isLastStep = state.stepIndex === sc.steps.length - 1;
    html += '<button class="btn-gold" style="margin-top:14px;" onclick="SPEAKPRO.'+(isLastStep ? 'finishScenario' : 'nextStep')+'()">' +
      (isLastStep ? 'See Full Summary' : 'Continue to Next Step') + ' <i class="fas fa-arrow-right" style="margin-left:6px;"></i></button>';

    var box = document.getElementById('feedbackBox');
    box.innerHTML = html;
    box.style.display = 'block';
    document.getElementById('submitBtn').style.display = 'none';
    box.scrollIntoView({behavior:'smooth', block:'nearest'});
  }

  window.SPEAKPRO = {
    goTo: function(s){ state.screen = s; render(); },
    startScenario: function(id){
      var sc = scenarios.filter(function(s){return s.id===id;})[0];
      if(!sc || !sc.available) return;
      state.scenarioId = id; state.stepIndex = 0; state.stepResults = [];
      state.screen = 'trainer'; render();
    },
    nextStep: function(){ state.stepIndex += 1; state.screen = 'trainer'; render(); },
    finishScenario: function(){ state.screen = 'summary'; render(); },
    retryScenario: function(){ state.stepIndex = 0; state.stepResults = []; state.screen = 'trainer'; render(); },
    exitScenario: function(){ state.screen = 'scenarios'; render(); }
  };

  // Deep-link support: /speakpro-demo.html?scenario=brakes jumps straight into that trainer
  var params = new URLSearchParams(window.location.search);
  var linkedScenario = params.get('scenario');
  if(linkedScenario){
    var match = scenarios.filter(function(s){ return s.id === linkedScenario && s.available; })[0];
    if(match){
      state.scenarioId = linkedScenario;
      state.stepIndex = 0;
      state.stepResults = [];
      state.screen = 'trainer';
    }
  }

  render();
})();
</script>
</body>
</html>
